##########
# sensores mikrotik
#
sensor:
  - platform: mikrotik
    host: 192.168.50.1
    name: "Tráfego Fibra (Ether1)"
    interface: ether1
    monitored_conditions:
      - tx
      - rx
  - platform: mikrotik
    host: 192.168.50.1
    name: "Tráfego 4G (Ether2)"
    interface: ether2
    monitored_conditions:
      - tx
      - rx
#
#
# Example configuration.yaml entry
#    sensor:
  - platform: command_line
    name: CPU Temperature
    command: "cat /sys/class/thermal/thermal_zone0/temp"
    # If errors occur, make sure configuration file is encoded as UTF-8
    unit_of_measurement: "°C"
    value_template: "{{ value | multiply(0.001) | round(1) }}"
##########
  - platform: openhardwaremonitor
    host: 192.168.0.128
##########
  - platform: history_stats
    name: Disponibilidade Claro horas - 30 dias
    entity_id: binary_sensor.net_claro
    state: "on"
    type: time
    end: "{{ now() }}"
    duration:
      days: 30
  - platform: history_stats
    name: Disponibilidade Claro count- 30 dias
    entity_id: binary_sensor.net_claro
    state: "on"
    type: count
    end: "{{ now() }}"
    duration:
      days: 30
  - platform: history_stats
    name: Disponibilidade Claro Media - 30 dias
    entity_id: binary_sensor.net_claro
    state: "on"
    type: ratio
    end: "{{ now() }}"
    duration:
      days: 30