###############################################################################
# Central Operacional V20.1Q.1 - Recovery Executor 4G
#
# Contrato: recebe request_id e indice generico autorizados pela Central e
# executa exatamente um power cycle. O resultado produzido e somente tecnico.
# Nao consulta detector de link, ping, bytes, latencia, Timeline ou Push.
###############################################################################

casa_recovery_4g_executar_tentativa:
  alias: Casa - Recovery 4G - Executar tentativa
  description: Executor fisico sem inteligencia de deteccao ou validacao do link.
  icon: mdi:router-wireless-settings
  mode: single
  max_exceeded: silent

  fields:
    solicitacao_id:
      name: Request ID
      required: true
      selector:
        text:
    tentativa:
      name: Tentativa autorizada
      required: true
      selector:
        number:
          min: 1
          max: 100
          step: 1
          mode: box
    modo_execucao:
      name: Modo de execucao (Harness)
      description: >
        "teste" ou "producao", capturado pelo orquestrador no nascimento do ciclo.
        Ausente/omitido -> tratado como "producao" (nao regressivo em relacao ao
        comportamento atual).
      required: false
      selector:
        select:
          options:
            - producao
            - teste

  variables:
    request_id_recebido: "{{ solicitacao_id | default('', true) | string | trim }}"
    tentativa_numero: "{{ tentativa | int(0) }}"
    token_tentativa: "{{ (request_id_recebido | string | trim) ~ ':' ~ (tentativa_numero | string) }}"
    tempo_off_segundos: >
      {{ states('input_number.casa_recovery_4g_tempo_off_segundos') | int(5) }}
    # Harness: capturado uma unica vez no nascimento desta execucao (variavel de
    # script, nunca relida do helper global). Autoridade exclusiva de decisao fisica.
    modo_execucao_capturado: "{{ modo_execucao | default('producao', true) }}"
    alvo_tomada: >
      {{ 'input_boolean.casa_recovery_4g_sim_tomada' if modo_execucao_capturado == 'teste'
         else 'switch.0xa4c1381045aeb344' }}
    motivo_bloqueio: >
      {% set request_atual = states('input_text.casa_recovery_4g_request_id') | string | trim %}
      {% set ultima = states('input_text.casa_recovery_4g_ultima_tentativa_processada') | string | trim %}
      {% set ciclo = is_state('input_boolean.casa_recovery_4g_ciclo_em_andamento', 'on') %}
      {% set tentativa_atual = states('input_number.casa_recovery_4g_tentativa_atual') | int(0) %}
      {% if not is_state('input_boolean.casa_recovery_4g_automatico', 'on') %}
        recovery_desabilitado
      {% elif request_id_recebido == '' or tentativa_numero | int < 1 %}
        comando_invalido
      {% elif request_atual != request_id_recebido %}
        request_id_nao_autorizado
      {% elif token_tentativa == ultima %}
        comando_duplicado
      {% elif not ciclo or tentativa_atual != tentativa_numero | int %}
        tentativa_nao_autorizada
      {% elif not is_state('binary_sensor.energia_concessionaria', 'on') %}
        energia_ausente_ou_inconclusiva
      {% elif states(alvo_tomada) in ['unknown', 'unavailable'] %}
        tomada_indisponivel
      {% else %}
        permitido
      {% endif %}

  sequence:
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ (motivo_bloqueio | trim) != 'permitido' }}"
          sequence:
            - service: input_select.select_option
              target:
                entity_id: input_select.casa_recovery_4g_estado_executor
              data:
                option: bloqueado
            - event: casa_recovery_4g_executor
              event_data:
                request_id: "{{ request_id_recebido }}"
                tentativa: "{{ tentativa_numero }}"
                fato: bloqueado
                motivo: "{{ motivo_bloqueio | trim }}"
            - stop: Tentativa bloqueada pelas permissoes do Executor.

    - service: input_select.select_option
      target:
        entity_id: input_select.casa_recovery_4g_estado_executor
      data:
        option: executando

    - event: casa_recovery_4g_executor
      event_data:
        request_id: "{{ request_id_recebido }}"
        tentativa: "{{ tentativa_numero }}"
        fato: power_cycle_iniciado

    # Harness: escreve na tomada simulada ou real conforme modo_execucao_capturado
    # (variavel de script congelada no nascimento desta execucao).
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ modo_execucao_capturado == 'teste' }}"
          sequence:
            - service: input_boolean.turn_off
              target:
                entity_id: input_boolean.casa_recovery_4g_sim_tomada
      default:
        - service: switch.turn_off
          target:
            entity_id: switch.0xa4c1381045aeb344
          continue_on_error: true

    - wait_template: "{{ is_state(alvo_tomada, 'off') }}"
      timeout:
        seconds: "{{ states('input_number.casa_recovery_4g_timeout_confirmacao_tomada_segundos') | int(5) }}"
      continue_on_timeout: true

    - choose:
        - conditions:
            - condition: template
              value_template: "{{ not wait.completed }}"
          sequence:
            - service: input_select.select_option
              target:
                entity_id: input_select.casa_recovery_4g_estado_executor
              data:
                option: erro
            - event: casa_recovery_4g_executor
              event_data:
                request_id: "{{ request_id_recebido }}"
                tentativa: "{{ tentativa_numero }}"
                fato: erro
                motivo: falha_ao_desligar_tomada
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ modo_execucao_capturado == 'teste' }}"
                  sequence:
                    - service: input_boolean.turn_on
                      target:
                        entity_id: input_boolean.casa_recovery_4g_sim_tomada
              default:
                - service: switch.turn_on
                  target:
                    entity_id: switch.0xa4c1381045aeb344
                  continue_on_error: true
            - stop: A tomada nao confirmou o desligamento.

    - delay:
        seconds: "{{ tempo_off_segundos | int }}"

    - choose:
        - conditions:
            - condition: template
              value_template: "{{ modo_execucao_capturado == 'teste' }}"
          sequence:
            - service: input_boolean.turn_on
              target:
                entity_id: input_boolean.casa_recovery_4g_sim_tomada
      default:
        - service: switch.turn_on
          target:
            entity_id: switch.0xa4c1381045aeb344
          continue_on_error: true

    - wait_template: "{{ is_state(alvo_tomada, 'on') }}"
      timeout:
        seconds: "{{ states('input_number.casa_recovery_4g_timeout_confirmacao_tomada_segundos') | int(5) }}"
      continue_on_timeout: true

    - choose:
        - conditions:
            - condition: template
              value_template: "{{ not wait.completed }}"
          sequence:
            - service: input_select.select_option
              target:
                entity_id: input_select.casa_recovery_4g_estado_executor
              data:
                option: erro
            - event: casa_recovery_4g_executor
              event_data:
                request_id: "{{ request_id_recebido }}"
                tentativa: "{{ tentativa_numero }}"
                fato: erro
                motivo: falha_ao_religar_tomada
            - stop: A tomada permaneceu desligada apos o power cycle.

    - service: input_text.set_value
      target:
        entity_id: input_text.casa_recovery_4g_ultima_tentativa_processada
      data:
        value: "{{ token_tentativa }}"

    - service: input_select.select_option
      target:
        entity_id: input_select.casa_recovery_4g_estado_executor
      data:
        option: concluido_tecnicamente

    - event: casa_recovery_4g_executor
      event_data:
        request_id: "{{ request_id_recebido }}"
        tentativa: "{{ tentativa_numero }}"
        fato: power_cycle_concluido
