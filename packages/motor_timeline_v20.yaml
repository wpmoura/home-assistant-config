automation:
  - id: v20_1o_push_eventos_operacionais
    alias: V20.1O - Push eventos operacionais
    mode: queued
    trigger:
      - platform: state
        entity_id: sensor.casa_evento_publicavel_v20
    condition:
      - condition: template
        value_template: >
          {% set evento = trigger.to_state.state if trigger.to_state is not none else '' %}
          {% set enviar = trigger.to_state.attributes.enviar_push | default(false, true) if trigger.to_state is not none else false %}
          {{ trigger.to_state is not none
             and enviar | string | lower | trim == 'true'
             and evento not in ['', 'unknown', 'unavailable', 'sem_evento'] }}
    action:
      - service: notify.mobile_app_iphonewm
        data:
          title: Central Operacional
          message: "{{ trigger.to_state.state }}"
