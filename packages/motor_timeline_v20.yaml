###############################################################################
# Central Operacional V20.1 - Motor de timeline operacional
#
# Camada paralela e isolada.
# Registra eventos relevantes por transicao de estado, incluindo eventos
# secundarios que nao vencem como evento dominante.
#
# V20.1 adiciona:
# - limite dinamico de eventos via input_number.casa_timeline_max_eventos
# - controle de publicacao por dominio/evento
# - portas internas, janelas/contatos e vazamento como eventos opcionais
#
# Nao altera sensor.status_casa.
# Nao depende de V17/V18/V19.
# Nao altera automacoes.
###############################################################################

template:
  - sensor:
      - name: Casa Porta Sala Estado V20
        unique_id: casa_porta_sala_estado_v20
        icon: mdi:door
        state: >
          {% if is_state('binary_sensor.sensor_porta_sala_contact', 'on') %}
            aberta
          {% elif is_state('binary_sensor.sensor_porta_sala_contact', 'off') %}
            fechada
          {% else %}
            desconhecida
          {% endif %}
        attributes:
          dominio: porta
          tipo: porta_sala
          fonte_real: binary_sensor.sensor_porta_sala_contact
          estado_real: "{{ states('binary_sensor.sensor_porta_sala_contact') }}"
          publicacao_controlada_por: input_boolean.casa_timeline_evento_porta_sala
          legado_relacionado: "automation.Sala - Porta da sala abriu; automation.alerta_contextual_porta_sala_v2"

      - name: Casa Porta Banheiro Estado V20
        unique_id: casa_porta_banheiro_estado_v20
        icon: mdi:door
        state: >
          {% if is_state('binary_sensor.sensor_porta_banheiro_contact', 'on') %}
            aberta
          {% elif is_state('binary_sensor.sensor_porta_banheiro_contact', 'off') %}
            fechada
          {% else %}
            desconhecida
          {% endif %}
        attributes:
          dominio: porta
          tipo: porta_interna
          fonte_real: binary_sensor.sensor_porta_banheiro_contact
          estado_real: "{{ states('binary_sensor.sensor_porta_banheiro_contact') }}"
          publicacao_controlada_por: input_boolean.casa_timeline_evento_portas_internas
          legado_relacionado: "automation.Corredor - Gestão Luz Segurança versus portas"

      - name: Casa Porta Quarto Menor Estado V20
        unique_id: casa_porta_quarto_menor_estado_v20
        icon: mdi:door
        state: >
          {% if is_state('binary_sensor.sensor_porta_sec_quarto_contact', 'on') %}
            aberta
          {% elif is_state('binary_sensor.sensor_porta_sec_quarto_contact', 'off') %}
            fechada
          {% else %}
            desconhecida
          {% endif %}
        attributes:
          dominio: porta
          tipo: porta_interna
          ambiente: quarto_menor
          fonte_real: binary_sensor.sensor_porta_sec_quarto_contact
          estado_real: "{{ states('binary_sensor.sensor_porta_sec_quarto_contact') }}"
          publicacao_controlada_por: input_boolean.casa_timeline_evento_portas_internas
          legado_relacionado: "automation.Corredor - Gestão Luz Segurança versus portas"

      - name: Casa Porta Quarto Maior Estado V20
        unique_id: casa_porta_quarto_maior_estado_v20
        icon: mdi:door
        state: >
          {% if is_state('binary_sensor.0x00158d0006b0a28b_contact', 'on') %}
            aberta
          {% elif is_state('binary_sensor.0x00158d0006b0a28b_contact', 'off') %}
            fechada
          {% else %}
            desconhecida
          {% endif %}
        attributes:
          dominio: porta
          tipo: porta_interna
          ambiente: quarto_maior
          fonte_real: binary_sensor.0x00158d0006b0a28b_contact
          estado_real: "{{ states('binary_sensor.0x00158d0006b0a28b_contact') }}"
          publicacao_controlada_por: input_boolean.casa_timeline_evento_portas_internas
          legado_relacionado: "automation.Corredor - Gestão Luz Segurança versus portas"

      - name: Casa Janela Varanda Sala Estado V20
        unique_id: casa_janela_varanda_sala_estado_v20
        icon: mdi:window-open-variant
        state: >
          {% if is_state('binary_sensor.sensor_varanda_sala_contact', 'on') %}
            aberta
          {% elif is_state('binary_sensor.sensor_varanda_sala_contact', 'off') %}
            fechada
          {% else %}
            desconhecida
          {% endif %}
        attributes:
          dominio: janela
          tipo: varanda_sala
          fonte_real: binary_sensor.sensor_varanda_sala_contact
          estado_real: "{{ states('binary_sensor.sensor_varanda_sala_contact') }}"
          publicacao_controlada_por: input_boolean.casa_timeline_evento_janelas
          legado_relacionado: sensor bruto identificado em V20.1A

      - name: Casa Janela Quarto Maior Estado V20
        unique_id: casa_janela_quarto_maior_estado_v20
        icon: mdi:window-open-variant
        state: >
          {% if is_state('binary_sensor.sensor_janela_quarto_maior_contact', 'on') %}
            aberta
          {% elif is_state('binary_sensor.sensor_janela_quarto_maior_contact', 'off') %}
            fechada
          {% else %}
            desconhecida
          {% endif %}
        attributes:
          dominio: janela
          tipo: quarto_maior
          fonte_real: binary_sensor.sensor_janela_quarto_maior_contact
          estado_real: "{{ states('binary_sensor.sensor_janela_quarto_maior_contact') }}"
          publicacao_controlada_por: input_boolean.casa_timeline_evento_janelas
          legado_relacionado: sensor informado na correcao V20.1B lote 1

      - name: Casa Janela Quarto Menor Estado V20
        unique_id: casa_janela_quarto_menor_estado_v20
        icon: mdi:window-open-variant
        state: >
          {% if is_state('binary_sensor.sensor_janela_quarto_menor_contact', 'on') %}
            aberta
          {% elif is_state('binary_sensor.sensor_janela_quarto_menor_contact', 'off') %}
            fechada
          {% else %}
            desconhecida
          {% endif %}
        attributes:
          dominio: janela
          tipo: quarto_menor
          fonte_real: binary_sensor.sensor_janela_quarto_menor_contact
          estado_real: "{{ states('binary_sensor.sensor_janela_quarto_menor_contact') }}"
          publicacao_controlada_por: input_boolean.casa_timeline_evento_janelas
          legado_relacionado: sensor informado na correcao V20.1B lote 1

      - name: Casa Chuva Estado V20
        unique_id: casa_chuva_estado_v20
        icon: mdi:weather-rainy
        state: >
          {% set invalid = ['unknown', 'unavailable', 'none', 'None', '', none] %}
          {% set chuva_bin = states('binary_sensor.sensor_chuva_girasol_rain') %}
          {% set intensidade = states('sensor.intensidade_da_chuva') %}
          {% if chuva_bin == 'on' %}
            ativa
          {% elif chuva_bin == 'off' %}
            inativa
          {% else %}
            desconhecida
          {% endif %}
        attributes:
          dominio: chuva
          tipo: chuva
          fonte_binaria: binary_sensor.sensor_chuva_girasol_rain
          fonte_intensidade: sensor.intensidade_da_chuva
          estado_binario: "{{ states('binary_sensor.sensor_chuva_girasol_rain') }}"
          intensidade: "{{ states('sensor.intensidade_da_chuva') }}"
          publicacao_controlada_por: input_boolean.casa_timeline_evento_chuva
          legado_relacionado: "automation.Quarto - Está chovendo; automation.Quarto - Parou de chover; automation.alerta_contextual_chuva_inicio_v2"

      - name: Casa Vazamento Estado V20
        unique_id: casa_vazamento_estado_v20
        icon: mdi:water-alert
        state: >
          {% set vazamento_principal = states('binary_sensor.sensor_vazmento_agua_water_leak') %}
          {% set vazamento_alt = states('binary_sensor.vazamento') %}
          {% if vazamento_principal == 'on' or vazamento_alt == 'on' %}
            detectado
          {% elif vazamento_principal == 'off' or vazamento_alt == 'off' %}
            normal
          {% else %}
            desconhecido
          {% endif %}
        attributes:
          dominio: vazamento
          tipo: vazamento
          fonte_principal: binary_sensor.sensor_vazmento_agua_water_leak
          fonte_alternativa: binary_sensor.vazamento
          estado_principal: "{{ states('binary_sensor.sensor_vazmento_agua_water_leak') }}"
          estado_alternativo: "{{ states('binary_sensor.vazamento') }}"
          publicacao_controlada_por: input_boolean.casa_timeline_evento_vazamento
          legado_relacionado: "blueprints/automation/wmoura/Alerta_Vazamento_com_Led.yaml; packages/cerebro_backup_formatado.yaml"

      - name: Casa Energia Estado V20
        unique_id: casa_energia_estado_v20
        icon: mdi:transmission-tower
        state: >
          {% set energia = states('binary_sensor.energia_concessionaria') %}
          {% if energia == 'on' %}
            presente
          {% elif energia == 'off' %}
            ausente
          {% else %}
            desconhecida
          {% endif %}
        attributes:
          dominio: energia
          tipo: energia_concessionaria
          fonte_real: binary_sensor.energia_concessionaria
          estado_real: "{{ states('binary_sensor.energia_concessionaria') }}"
          ups_voltagem: "{{ states('sensor.ups_voltagem') }}"
          ups_potencia: "{{ states('sensor.ups_potencia') }}"
          publicacao_controlada_por: input_boolean.casa_timeline_evento_energia
          legado_relacionado: "automation.Home Office - Monitorar falta de energia e desligar após 30 minutos; blueprints/automation/wmoura/Gestão de Energia - UPS.yaml"

      - name: Casa Internet Estado V20
        unique_id: casa_internet_estado_v20
        icon: mdi:wan
        state: >
          {% set invalid = ['unknown', 'unavailable', 'none', 'None', '', none] %}
          {% set estado = states('sensor.internet_estado_operacional') %}
          {% set wan_principal = states('binary_sensor.internet_wan_principal_ok') %}
          {% set wan2_4g = states('binary_sensor.internet_wan2_4g_ok') %}
          {% set failover = states('binary_sensor.internet_em_failover_4g') %}
          {% set wan_semantico = states('sensor.casa_internet_estado_semantico_v20') %}
          {% if estado == 'critica' %}
            indisponivel
          {% elif failover == 'on' or estado in ['backup_4g_indisponivel', 'failover_4g'] %}
            degradada
          {% elif estado == 'normal' and wan_principal == 'on' %}
            normal
          {% elif estado in invalid and wan_principal in invalid and wan2_4g in invalid %}
            desconhecida
          {% elif estado in invalid and wan_semantico == 'normal' %}
            normal
          {% elif estado in invalid and wan_semantico == 'indisponivel' %}
            indisponivel
          {% elif estado in invalid and wan_semantico in ['failover_4g', 'instavel'] %}
            degradada
          {% else %}
            degradada
          {% endif %}
        attributes:
          dominio: internet
          tipo: conectividade
          fonte_principal: sensor.internet_estado_operacional
          fonte_wan_v20: sensor.casa_internet_estado_semantico_v20
          estado_principal: "{{ states('sensor.internet_estado_operacional') }}"
          estado_wan_v20: "{{ states('sensor.casa_internet_estado_semantico_v20') }}"
          wan_principal_ok: "{{ states('binary_sensor.internet_wan_principal_ok') }}"
          wan2_4g_ok: "{{ states('binary_sensor.internet_wan2_4g_ok') }}"
          publicacao_controlada_por: input_boolean.casa_timeline_evento_internet
          legado_relacionado: "automation.Home Office - Internet - Sem Conexão com Internet; automation.Home Office - Internet - Retorno da Conexão"

      - name: Casa Failover Estado V20
        unique_id: casa_failover_estado_v20
        icon: mdi:router-wireless
        state: >
          {% set failover = states('binary_sensor.internet_em_failover_4g') %}
          {% set estado = states('sensor.internet_estado_operacional') %}
          {% set failover_wan = states('binary_sensor.casa_failover_ativo_v20') %}
          {% if failover == 'on' or estado == 'failover_4g' or failover_wan == 'on' %}
            ativo
          {% elif failover == 'off' or estado in ['normal', 'backup_4g_indisponivel', 'critica'] or failover_wan == 'off' %}
            inativo
          {% else %}
            desconhecido
          {% endif %}
        attributes:
          dominio: failover
          tipo: failover_4g
          fonte_principal: binary_sensor.internet_em_failover_4g
          fonte_estado_internet: sensor.internet_estado_operacional
          fonte_wan_v20: binary_sensor.casa_failover_ativo_v20
          estado_principal: "{{ states('binary_sensor.internet_em_failover_4g') }}"
          estado_internet: "{{ states('sensor.internet_estado_operacional') }}"
          estado_wan_v20: "{{ states('binary_sensor.casa_failover_ativo_v20') }}"
          publicacao_controlada_por: input_boolean.casa_timeline_evento_failover
          legado_relacionado: "blueprints/automation/wmoura/wan_4G_AppleWatch_Energia.yaml; blueprints/automation/wmoura/wan_4G_AppleWatch.yaml"

      - name: Casa Backup Google Estado V20
        unique_id: casa_backup_google_estado_v20
        icon: mdi:cloud-check-outline
        state: >
          {% set invalid = ['unknown', 'unavailable', 'none', 'None', '', none] %}
          {% set backup = states('sensor.backup_google_status') %}
          {% if backup in ['erro', 'falha', 'failed', 'failure', 'error', 'atencao', 'atenção'] %}
            falha
          {% elif backup in ['ok', 'backed_up', 'backing_up', 'idle', 'completed'] %}
            ok
          {% elif backup in invalid %}
            desconhecido
          {% else %}
            falha
          {% endif %}
        attributes:
          dominio: backup
          tipo: backup_google
          fonte_real: sensor.backup_google_status
          fonte_original: sensor.backup_state
          estado_real: "{{ states('sensor.backup_google_status') }}"
          estado_original: "{{ states('sensor.backup_state') }}"
          publicacao_controlada_por: input_boolean.casa_timeline_evento_backup_google
          legado_relacionado: "sensor.backup_google_status em central_mensagens_corrigido.yaml"

  - trigger:
      - platform: state
        id: banho_inicio
        entity_id: binary_sensor.movimento_alto_banheiro_occupancy
        to: "on"

      - platform: state
        id: banho_timeout
        entity_id: binary_sensor.movimento_alto_banheiro_occupancy
        to: "off"
        for:
          minutes: 2

    sensor:
      - name: Casa Banho Estado V20
        unique_id: casa_banho_estado_v20
        icon: mdi:shower-head
        state: >
          {% set tid = trigger.id if trigger is defined else '' %}
          {% set old = trigger.from_state.state if trigger is defined and trigger.from_state is not none else '' %}
          {% if tid == 'banho_inicio' and old == 'off' %}
            banho_detectado
          {% elif tid == 'banho_timeout' %}
            sem_banho
          {% else %}
            {{ this.state | default('desconhecido', true) }}
          {% endif %}
        attributes:
          dominio: contexto_humano
          tipo: banho
          fonte_real: binary_sensor.movimento_alto_banheiro_occupancy
          estado_real: "{{ states('binary_sensor.movimento_alto_banheiro_occupancy') }}"
          classificacao: evento_semantico_humano
          timeout_encerramento_minutos: 2
          publicacao_controlada_por: input_boolean.casa_timeline_evento_banho
          observacao: "Sensor do box/chuveiro; nao tratar como movimento generico"

  - trigger:
      - platform: state
        id: mudanca_estado
        entity_id:
          - sensor.casa_energia_estado_v20
          - sensor.casa_internet_estado_v20
          - sensor.casa_failover_estado_v20
          - sensor.casa_backup_google_estado_v20
          - sensor.casa_porta_sala_estado_v20
          - sensor.casa_porta_banheiro_estado_v20
          - sensor.casa_porta_quarto_menor_estado_v20
          - sensor.casa_porta_quarto_maior_estado_v20
          - sensor.casa_janela_varanda_sala_estado_v20
          - sensor.casa_janela_quarto_maior_estado_v20
          - sensor.casa_janela_quarto_menor_estado_v20
          - sensor.casa_vazamento_estado_v20
          - sensor.casa_banho_estado_v20
          - sensor.casa_chuva_estado_v20
          - sensor.casa_atividade_operacional_v20
          - binary_sensor.sensor_chuva_girasol_rain
          - sensor.intensidade_da_chuva

      - platform: state
        id: porta_timeout
        entity_id: binary_sensor.sensor_porta_sala_contact
        to: "on"
        for:
          minutes: "{{ states('input_number.casa_timeout_porta_aberta_minutos') | int(5) }}"

    sensor:
      - name: Casa Evento Publicavel V20
        unique_id: casa_evento_publicavel_v20
        icon: mdi:timeline-plus-outline
        state: >
          {% set invalid = ['unknown', 'unavailable', 'none', 'None', '', none] %}
          {% set tid = trigger.id if trigger is defined else '' %}
          {% set eid = trigger.entity_id if trigger is defined else '' %}
          {% set old = trigger.from_state.state if trigger is defined and trigger.from_state is not none else '' %}
          {% set new = trigger.to_state.state if trigger is defined and trigger.to_state is not none else '' %}
          {% set timeout_min = states('input_number.casa_timeout_porta_aberta_minutos') | int(5) %}
          {% set porta_sala_timeout = 'binary_sensor.sensor_porta_sala_contact' %}
          {% set porta_sala = 'sensor.casa_porta_sala_estado_v20' %}
          {% set evento = '' %}

          {% set publica_tv = not is_state('input_boolean.casa_timeline_evento_tv', 'off') %}
          {% set publica_chuva = not is_state('input_boolean.casa_timeline_evento_chuva', 'off') %}
          {% set publica_porta_sala = not is_state('input_boolean.casa_timeline_evento_porta_sala', 'off') %}
          {% set publica_portas_internas = is_state('input_boolean.casa_timeline_evento_portas_internas', 'on') %}
          {% set publica_janelas = is_state('input_boolean.casa_timeline_evento_janelas', 'on') %}
          {% set publica_vazamento = is_state('input_boolean.casa_timeline_evento_vazamento', 'on') %}
          {% set publica_banho = is_state('input_boolean.casa_timeline_evento_banho', 'on') %}
          {% set publica_backup = not is_state('input_boolean.casa_timeline_evento_backup_google', 'off') %}
          {% set publica_energia = not is_state('input_boolean.casa_timeline_evento_energia', 'off') %}
          {% set publica_internet = not is_state('input_boolean.casa_timeline_evento_internet', 'off') %}
          {% set publica_failover = not is_state('input_boolean.casa_timeline_evento_failover', 'off') %}

          {% if publica_porta_sala and tid == 'porta_timeout' and eid == porta_sala_timeout and new == 'on' %}
            {% set evento = now().strftime('%H:%M') ~ ' 🚪 Porta sala aberta há ' ~ timeout_min ~ ' min' %}
          {% elif publica_porta_sala and eid == porta_sala and new == 'aberta' and old == 'fechada' %}
            {% set evento = now().strftime('%H:%M') ~ ' 🚪 Porta sala aberta' %}
          {% elif publica_porta_sala and eid == porta_sala and new == 'fechada' and old == 'aberta' %}
            {% set evento = now().strftime('%H:%M') ~ ' 🚪 Porta sala fechada' %}
          {% elif publica_portas_internas and eid == 'sensor.casa_porta_banheiro_estado_v20' and new == 'aberta' and old == 'fechada' %}
            {% set evento = now().strftime('%H:%M') ~ ' 🚪 Porta banheiro aberta' %}
          {% elif publica_portas_internas and eid == 'sensor.casa_porta_banheiro_estado_v20' and new == 'fechada' and old == 'aberta' %}
            {% set evento = now().strftime('%H:%M') ~ ' 🚪 Porta banheiro fechada' %}
          {% elif publica_portas_internas and eid == 'sensor.casa_porta_quarto_menor_estado_v20' and new == 'aberta' and old == 'fechada' %}
            {% set evento = now().strftime('%H:%M') ~ ' 🚪 Porta Quarto Menor aberta' %}
          {% elif publica_portas_internas and eid == 'sensor.casa_porta_quarto_menor_estado_v20' and new == 'fechada' and old == 'aberta' %}
            {% set evento = now().strftime('%H:%M') ~ ' 🚪 Porta Quarto Menor fechada' %}
          {% elif publica_portas_internas and eid == 'sensor.casa_porta_quarto_maior_estado_v20' and new == 'aberta' and old == 'fechada' %}
            {% set evento = now().strftime('%H:%M') ~ ' 🚪 Porta Quarto Maior aberta' %}
          {% elif publica_portas_internas and eid == 'sensor.casa_porta_quarto_maior_estado_v20' and new == 'fechada' and old == 'aberta' %}
            {% set evento = now().strftime('%H:%M') ~ ' 🚪 Porta Quarto Maior fechada' %}
          {% elif publica_janelas and eid == 'sensor.casa_janela_varanda_sala_estado_v20' and new == 'aberta' and old == 'fechada' %}
            {% set evento = now().strftime('%H:%M') ~ ' 🪟 Varanda sala aberta' %}
          {% elif publica_janelas and eid == 'sensor.casa_janela_varanda_sala_estado_v20' and new == 'fechada' and old == 'aberta' %}
            {% set evento = now().strftime('%H:%M') ~ ' 🪟 Varanda sala fechada' %}
          {% elif publica_janelas and eid == 'sensor.casa_janela_quarto_maior_estado_v20' and new == 'aberta' and old == 'fechada' %}
            {% set evento = now().strftime('%H:%M') ~ ' 🪟 Janela Quarto Maior aberta' %}
          {% elif publica_janelas and eid == 'sensor.casa_janela_quarto_maior_estado_v20' and new == 'fechada' and old == 'aberta' %}
            {% set evento = now().strftime('%H:%M') ~ ' 🪟 Janela Quarto Maior fechada' %}
          {% elif publica_janelas and eid == 'sensor.casa_janela_quarto_menor_estado_v20' and new == 'aberta' and old == 'fechada' %}
            {% set evento = now().strftime('%H:%M') ~ ' 🪟 Janela Quarto Menor aberta' %}
          {% elif publica_janelas and eid == 'sensor.casa_janela_quarto_menor_estado_v20' and new == 'fechada' and old == 'aberta' %}
            {% set evento = now().strftime('%H:%M') ~ ' 🪟 Janela Quarto Menor fechada' %}
          {% elif publica_vazamento and eid == 'sensor.casa_vazamento_estado_v20' and new == 'detectado' and old != 'detectado' %}
            {% set evento = now().strftime('%H:%M') ~ ' 💧 Vazamento detectado' %}
          {% elif publica_vazamento and eid == 'sensor.casa_vazamento_estado_v20' and new == 'normal' and old == 'detectado' %}
            {% set evento = now().strftime('%H:%M') ~ ' 💧 Vazamento normalizado' %}
          {% elif publica_banho and eid == 'sensor.casa_banho_estado_v20' and new == 'banho_detectado' and old == 'sem_banho' %}
            {% set evento = now().strftime('%H:%M') ~ ' 🚿 Banho iniciado' %}
          {% elif publica_banho and eid == 'sensor.casa_banho_estado_v20' and new == 'sem_banho' and old == 'banho_detectado' %}
            {% set evento = now().strftime('%H:%M') ~ ' 🚿 Banho encerrado' %}
          {% elif publica_energia and eid == 'sensor.casa_energia_estado_v20' and new == 'ausente' and old == 'presente' %}
            {% set evento = now().strftime('%H:%M') ~ ' ⚡ Falta de energia' %}
          {% elif publica_energia and eid == 'sensor.casa_energia_estado_v20' and new == 'presente' and old == 'ausente' %}
            {% set evento = now().strftime('%H:%M') ~ ' ⚡ Energia restabelecida' %}
          {% elif publica_chuva and eid == 'binary_sensor.sensor_chuva_girasol_rain' and new == 'on' and old == 'off' %}
            {% set intensidade = states('sensor.intensidade_da_chuva') %}
            {% if intensidade not in invalid + ['Sem chuva'] %}
              {% set evento = now().strftime('%H:%M') ~ ' 🌧️ Chuva iniciada: ' ~ intensidade %}
            {% else %}
              {% set evento = now().strftime('%H:%M') ~ ' 🌧️ Chuva iniciada' %}
            {% endif %}
          {% elif publica_chuva and eid == 'binary_sensor.sensor_chuva_girasol_rain' and new == 'off' and old == 'on' %}
            {% set evento = now().strftime('%H:%M') ~ ' 🌤️ Chuva encerrada' %}
          {% elif publica_chuva and eid == 'sensor.intensidade_da_chuva' and is_state('binary_sensor.sensor_chuva_girasol_rain', 'on') and is_state('sensor.casa_chuva_estado_v20', 'ativa') and new not in invalid + ['Sem chuva'] and old not in invalid + ['Sem chuva'] and new != old %}
            {% set evento = now().strftime('%H:%M') ~ ' 🌧️ Intensidade da chuva: ' ~ new %}
          {% elif publica_chuva and eid == 'sensor.casa_chuva_estado_v20' and is_state('binary_sensor.sensor_chuva_girasol_rain', 'on') and new == 'ativa' and old == 'inativa' %}
            {% set intensidade = state_attr('sensor.casa_chuva_estado_v20', 'intensidade') %}
            {% if intensidade not in invalid + ['Sem chuva'] %}
              {% set evento = now().strftime('%H:%M') ~ ' 🌧️ Chuva iniciada: ' ~ intensidade %}
            {% else %}
              {% set evento = now().strftime('%H:%M') ~ ' 🌧️ Chuva iniciada' %}
            {% endif %}
          {% elif publica_chuva and eid == 'sensor.casa_chuva_estado_v20' and is_state('binary_sensor.sensor_chuva_girasol_rain', 'off') and new == 'inativa' and old == 'ativa' %}
            {% set evento = now().strftime('%H:%M') ~ ' 🌤️ Chuva encerrada' %}
          {% elif publica_internet and eid == 'sensor.casa_internet_estado_v20' and new == 'degradada' and old in ['normal', 'indisponivel'] %}
            {% set evento = now().strftime('%H:%M') ~ ' 🌐 Internet degradada' %}
          {% elif publica_internet and eid == 'sensor.casa_internet_estado_v20' and new == 'indisponivel' and old in ['normal', 'degradada'] %}
            {% set evento = now().strftime('%H:%M') ~ ' 🌐 Internet indisponível' %}
          {% elif publica_internet and eid == 'sensor.casa_internet_estado_v20' and new == 'normal' and old in ['degradada', 'indisponivel'] %}
            {% set evento = now().strftime('%H:%M') ~ ' 🌐 Internet normalizada' %}
          {% elif publica_failover and eid == 'sensor.casa_failover_estado_v20' and new == 'ativo' and old == 'inativo' %}
            {% set evento = now().strftime('%H:%M') ~ ' 📡 Failover 4G ativado' %}
          {% elif publica_failover and eid == 'sensor.casa_failover_estado_v20' and new == 'inativo' and old == 'ativo' %}
            {% set evento = now().strftime('%H:%M') ~ ' 📡 Failover 4G encerrado' %}
          {% elif publica_backup and eid == 'sensor.casa_backup_google_estado_v20' and new == 'falha' and old == 'ok' %}
            {% set evento = now().strftime('%H:%M') ~ ' ⚠️ Backup Google com falha' %}
          {% elif publica_backup and eid == 'sensor.casa_backup_google_estado_v20' and new == 'ok' and old == 'falha' %}
            {% set evento = now().strftime('%H:%M') ~ ' ✅ Backup Google normalizado' %}
          {% elif eid == 'sensor.casa_atividade_operacional_v20' and new != old and new not in invalid %}
            {% set raw_atividades = state_attr('sensor.casa_atividade_operacional_v20', 'atividades_ativas') | default('[]', true) %}
            {% set atividades = raw_atividades | from_json(default=[]) if raw_atividades is string else raw_atividades %}
            {% set titulo = state_attr('sensor.casa_atividade_operacional_v20', 'titulo_ui') | default('', true) | string | trim %}
            {% set mensagem = state_attr('sensor.casa_atividade_operacional_v20', 'mensagem') | default('', true) | string | trim %}
            {% set dominante = state_attr('sensor.casa_atividade_operacional_v20', 'atividade_dominante') | default('', true) %}
            {% set dominios = atividades | map(attribute='dominio') | list %}
            {% set ns = namespace(partes=[], icones='', restante='') %}
            {% if 'tv' in dominios %}
              {% set tv_item = atividades | selectattr('dominio', 'eq', 'tv') | list | first | default({}, true) %}
              {% set tv_titulo = tv_item.titulo_ui | default(titulo if dominante == 'tv' else 'TV ligada', true) %}
              {% set ns.partes = ns.partes + ['TV'] %}
              {% set ns.icones = ns.icones ~ '📺' %}
              {% if dominante == 'tv' or new == 'tv_ativa' %}
                {% set ns.restante = tv_titulo if tv_titulo not in invalid + [''] else 'TV ligada' %}
                {% if not ns.restante.startswith('📺') %}
                  {% set ns.restante = '📺 ' ~ ns.restante %}
                {% endif %}
              {% endif %}
            {% endif %}
            {% if 'microondas' in dominios %}
              {% set ns.partes = ns.partes + ['Microondas'] %}
              {% set ns.icones = ns.icones ~ '🍿' %}
              {% if dominante == 'microondas' or new == 'microondas_ativo' %}
                {% set ns.restante = '🍿 Microondas em uso' %}
              {% endif %}
            {% endif %}
            {% if 'maquina_lavar' in dominios %}
              {% set maquina_item = atividades | selectattr('dominio', 'eq', 'maquina_lavar') | list | first | default({}, true) %}
              {% set maquina_titulo = maquina_item.titulo_ui | default('Máquina de lavar ativa', true) %}
              {% set ns.partes = ns.partes + ['Máquina'] %}
              {% set ns.icones = ns.icones ~ '🧺' %}
              {% if dominante == 'maquina_lavar' or new == 'maquina_lavar_ativa' %}
                {% set ns.restante = maquina_titulo if maquina_titulo not in invalid + [''] else '🧺 Máquina em execução' %}
              {% endif %}
            {% endif %}
            {% if 'banho' in dominios %}
              {% set banho_item = atividades | selectattr('dominio', 'eq', 'banho') | list | first | default({}, true) %}
              {% set banho_titulo = banho_item.titulo_ui | default('Banho em andamento', true) %}
              {% set ns.partes = ns.partes + ['Banho'] %}
              {% set ns.icones = ns.icones ~ '🚿' %}
              {% if dominante == 'banho' or new == 'banho_ativo' %}
                {% set ns.restante = '🚿 ' ~ banho_titulo %}
              {% endif %}
            {% endif %}
            {% set resumo_ativo = ns.partes | join(' + ') %}
            {% if new == 'multiatividade' and old != 'multiatividade' and resumo_ativo | length > 0 %}
              {% set evento = now().strftime('%H:%M') ~ ' ' ~ ns.icones ~ ' ' ~ resumo_ativo ~ ' ativos' %}
            {% elif old == 'multiatividade' and new != 'multiatividade' and ns.restante | length > 0 %}
              {% set evento = now().strftime('%H:%M') ~ ' ' ~ ns.restante %}
            {% elif old == 'multiatividade' and new == 'sem_atividade' %}
              {% set evento = now().strftime('%H:%M') ~ ' Atividades simultâneas encerradas' %}
            {% elif new == 'microondas_ativo' and old != 'microondas_ativo' %}
              {% set evento = now().strftime('%H:%M') ~ ' 🍿 Microondas em uso' %}
            {% elif old == 'microondas_ativo' and new != 'microondas_ativo' %}
              {% set evento = now().strftime('%H:%M') ~ ' 🍿 Microondas finalizado' %}
            {% elif new == 'maquina_lavar_ativa' and old != 'maquina_lavar_ativa' %}
              {% set evento = now().strftime('%H:%M') ~ ' ' ~ (titulo if titulo not in invalid + [''] else '🧺 Máquina em execução') %}
            {% elif old == 'maquina_lavar_ativa' and new != 'maquina_lavar_ativa' %}
              {% set evento = now().strftime('%H:%M') ~ ' 🧺 Máquina finalizada' %}
            {% elif publica_tv and new == 'tv_ativa' and old != 'tv_ativa' %}
              {% set tv_evento = titulo if titulo not in invalid + [''] else mensagem if mensagem not in invalid + [''] else 'TV ligada' %}
              {% if not tv_evento.startswith('📺') %}
                {% set tv_evento = '📺 ' ~ tv_evento %}
              {% endif %}
              {% set evento = now().strftime('%H:%M') ~ ' ' ~ tv_evento %}
            {% elif publica_tv and old == 'tv_ativa' and new != 'tv_ativa' %}
              {% set evento = now().strftime('%H:%M') ~ ' 📺 TV desligada' %}
            {% endif %}
          {% endif %}

          {% if evento == '' %}
            {{ this.state | default('sem_evento', true) }}
          {% else %}
            {{ evento }}
          {% endif %}
        attributes:
          fonte: "{{ trigger.entity_id if trigger is defined else 'motor_timeline_v20' }}"
          formato_publicacao: HH:MM mensagem
          timeout_porta_minutos: "{{ states('input_number.casa_timeout_porta_aberta_minutos') | int(5) }}"
          publica_tv: "{{ not is_state('input_boolean.casa_timeline_evento_tv', 'off') }}"
          publica_chuva: "{{ not is_state('input_boolean.casa_timeline_evento_chuva', 'off') }}"
          publica_porta_sala: "{{ not is_state('input_boolean.casa_timeline_evento_porta_sala', 'off') }}"
          publica_portas_internas: "{{ is_state('input_boolean.casa_timeline_evento_portas_internas', 'on') }}"
          publica_janelas: "{{ is_state('input_boolean.casa_timeline_evento_janelas', 'on') }}"
          publica_vazamento: "{{ is_state('input_boolean.casa_timeline_evento_vazamento', 'on') }}"
          publica_banho: "{{ is_state('input_boolean.casa_timeline_evento_banho', 'on') }}"
          publica_backup_google: "{{ not is_state('input_boolean.casa_timeline_evento_backup_google', 'off') }}"
          publica_energia: "{{ not is_state('input_boolean.casa_timeline_evento_energia', 'off') }}"
          publica_internet: "{{ not is_state('input_boolean.casa_timeline_evento_internet', 'off') }}"
          publica_failover: "{{ not is_state('input_boolean.casa_timeline_evento_failover', 'off') }}"
          estado_controle_tv: "{{ states('input_boolean.casa_timeline_evento_tv') }}"
          estado_controle_chuva: "{{ states('input_boolean.casa_timeline_evento_chuva') }}"
          estado_controle_porta_sala: "{{ states('input_boolean.casa_timeline_evento_porta_sala') }}"
          estado_controle_portas_internas: "{{ states('input_boolean.casa_timeline_evento_portas_internas') }}"
          estado_controle_janelas: "{{ states('input_boolean.casa_timeline_evento_janelas') }}"
          estado_controle_vazamento: "{{ states('input_boolean.casa_timeline_evento_vazamento') }}"
          estado_controle_banho: "{{ states('input_boolean.casa_timeline_evento_banho') }}"
          estado_controle_backup_google: "{{ states('input_boolean.casa_timeline_evento_backup_google') }}"
          estado_controle_energia: "{{ states('input_boolean.casa_timeline_evento_energia') }}"
          estado_controle_internet: "{{ states('input_boolean.casa_timeline_evento_internet') }}"
          estado_controle_failover: "{{ states('input_boolean.casa_timeline_evento_failover') }}"
          evento_reconhecido: >
            {% set estado = this.state | default('', true) | string | trim %}
            {{ estado not in ['', 'unknown', 'unavailable', 'sem_evento'] }}

  - trigger:
      - platform: state
        entity_id:
          - sensor.casa_evento_publicavel_v20
          - input_number.casa_timeline_max_eventos

