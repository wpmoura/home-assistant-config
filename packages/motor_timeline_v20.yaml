          fonte: sensor.casa_evento_publicavel_v20
          formato_publicacao: HH:MM mensagem
          limite_eventos: "{{ [states('input_number.casa_timeline_max_eventos') | int(6), 3] | max }}"
          deduplicacao: evento_consecutivo_sem_timestamp
