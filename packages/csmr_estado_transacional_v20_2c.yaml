###############################################################################
# V20.2C-I2A — Estado transacional do CSMR com reserva controlada
#
# Harness de estado sem presença, Timeline, Event Feed, consumidores ou efeitos
# físicos. O único writer é o script serial abaixo; o sensor trigger-based é o
# checkpoint persistente restaurado pelo Home Assistant após restart/reload.
###############################################################################

template:
  - trigger:
      - platform: event
        event_type: casa_csmr_checkpoint_v20_2c

    sensor:
      - name: Casa CSMR Estado V20 2C
        unique_id: casa_csmr_estado_v20_2c
        icon: mdi:state-machine
        state: >
          {{ trigger.event.data.state | default('failed', true) }}
        attributes:
          schema_version: 1
          session_id: "{{ trigger.event.data.session_id | default('', true) }}"
          started_at: "{{ trigger.event.data.started_at | default('', true) }}"
          ended_at: "{{ trigger.event.data.ended_at | default('', true) }}"
          transition_started_at: "{{ trigger.event.data.transition_started_at | default('', true) }}"
          last_transition_at: "{{ trigger.event.data.last_transition_at | default('', true) }}"
          transition_request_id: "{{ trigger.event.data.transition_request_id | default('', true) }}"
          transition_action: "{{ trigger.event.data.transition_action | default('', true) }}"
          transition_reason: "{{ trigger.event.data.transition_reason | default('', true) }}"
          transition_source: "{{ trigger.event.data.transition_source | default('harness_i2', true) }}"
          previous_state: "{{ trigger.event.data.previous_state | default('', true) }}"
          last_consistent_state: "{{ trigger.event.data.last_consistent_state | default('idle', true) }}"
          last_error: "{{ trigger.event.data.last_error | default('', true) }}"
          last_session_id: "{{ trigger.event.data.last_session_id | default('', true) }}"
          session_reserved: >-
            {{ trigger.event.data.session_reserved
               | default(this.attributes.session_reserved | default(false), false) }}
          reserved_session_id: >-
            {{ trigger.event.data.reserved_session_id
               | default(this.attributes.reserved_session_id | default('', true), false) }}
          reservation_request_id: >-
            {{ trigger.event.data.reservation_request_id
               | default(this.attributes.reservation_request_id | default('', true), false) }}
          reserved_at: >-
            {{ trigger.event.data.reserved_at
               | default(this.attributes.reserved_at | default('', true), false) }}
          reservation_source: >-
            {{ trigger.event.data.reservation_source
               | default(this.attributes.reservation_source | default('', true), false) }}
          reservation_reason: >-
            {{ trigger.event.data.reservation_reason
               | default(this.attributes.reservation_reason | default('', true), false) }}
          reservation_test_mode: >-
            {{ trigger.event.data.reservation_test_mode
               | default(this.attributes.reservation_test_mode | default(true), false) }}
          consumed_reservation_request_id: >-
            {{ trigger.event.data.consumed_reservation_request_id
               | default(this.attributes.consumed_reservation_request_id | default('', true), false) }}
          test_mode: "{{ trigger.event.data.test_mode | default(this.attributes.test_mode | default(true), false) }}"
          transition_ledger: >
            {% set atual = this.attributes.transition_ledger | default([], true) %}
            {% set atual = atual if atual is iterable and atual is not string and atual is not mapping else [] %}
            {% if trigger.event.data.append_ledger | default(false) %}
              {% set entrada = {
                'request_id': trigger.event.data.transition_request_id,
                'action': trigger.event.data.transition_action,
                'result': trigger.event.data.result,
                'state': trigger.event.data.state,
                'session_id': trigger.event.data.ledger_session_id
                  | default(trigger.event.data.session_id | default(trigger.event.data.last_session_id, true), true),
                'processed_at': trigger.event.data.last_transition_at
              } %}
              {{ ([entrada] + atual)[:16] }}
            {% else %}
              {{ atual[:16] }}
            {% endif %}
          contrato: >
            {{ {
              'lote': 'V20.2C-I2A',
              'states': ['idle', 'starting', 'active', 'ending', 'failed'],
              'transition_identity': 'request_id',
              'session_identity': 'session_id',
              'source': 'harness_i2',
              'operational_source': 'csmr_dispatcher_v20_2c',
              'reservation_authority': 'csmr',
              'test_mode_only': false
            } }}

script:
  casa_csmr_transicionar_v20_2c:
    alias: Casa — CSMR — Transição Controlada V20.2C
    description: >-
      Interface serial do estado transacional do CSMR para Harness e dispatcher
      operacional autorizado. Não publica eventos nem aciona consumidores.
    icon: mdi:state-machine
    mode: queued
    max: 10
    fields:
      action:
        name: Ação
        required: false
        selector:
          select:
            options:
              - open
              - close
              - recover
              - reserve
              - cancel_reservation
      request_id:
        name: Request ID
        required: false
        selector:
          text:
      source:
        name: Origem
        required: false
        selector:
          text:
      session_id:
        name: Session ID reservado
        required: false
        selector:
          text:
      reason:
        name: Motivo técnico
        required: false
        selector:
          text:
      test_mode:
        name: Test mode
        required: false
        selector:
          boolean:
      simulate_failure:
        name: Simular falha
        required: false
        selector:
          boolean:

    sequence:
      - variables:
          action_norm: "{{ action | default('', true) | string | trim }}"
          request_id_norm: "{{ request_id | default('', true) | string | trim }}"
          source_norm: >-
            {% if source is defined %}{{ source | string | trim }}
            {% elif test_mode is defined and test_mode is boolean and test_mode %}harness_i2
            {% else %}{% endif %}
          requested_session_id: "{{ session_id | default('', true) | string | trim }}"
          reason_norm: "{{ reason | default('', true) | string | trim }}"
          test_mode_raw: "{{ test_mode | default(none) }}"
          simulate_failure_raw: "{{ simulate_failure | default(false) }}"
          uuid_pattern: >-
            ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
          raw_state: "{{ states('sensor.casa_csmr_estado_v20_2c') }}"
          current_state: >-
            {{ raw_state if raw_state in ['idle', 'starting', 'active', 'ending', 'failed'] else 'idle' }}
          current_session_id: >-
            {{ state_attr('sensor.casa_csmr_estado_v20_2c', 'session_id') | default('', true) }}
          current_started_at: >-
            {{ state_attr('sensor.casa_csmr_estado_v20_2c', 'started_at') | default('', true) }}
          current_ended_at: >-
            {{ state_attr('sensor.casa_csmr_estado_v20_2c', 'ended_at') | default('', true) }}
          current_last_session_id: >-
            {{ state_attr('sensor.casa_csmr_estado_v20_2c', 'last_session_id') | default('', true) }}
          session_reserved: >-
            {{ state_attr('sensor.casa_csmr_estado_v20_2c', 'session_reserved') | default(false) | bool(false) }}
          reserved_session_id: >-
            {{ state_attr('sensor.casa_csmr_estado_v20_2c', 'reserved_session_id') | default('', true) }}
          reservation_request_id: >-
            {{ state_attr('sensor.casa_csmr_estado_v20_2c', 'reservation_request_id') | default('', true) }}
          reserved_at: >-
            {{ state_attr('sensor.casa_csmr_estado_v20_2c', 'reserved_at') | default('', true) }}
          reservation_source: >-
            {{ state_attr('sensor.casa_csmr_estado_v20_2c', 'reservation_source') | default('', true) }}
          reservation_reason: >-
            {{ state_attr('sensor.casa_csmr_estado_v20_2c', 'reservation_reason') | default('', true) }}
          reservation_test_mode: >-
            {{ state_attr('sensor.casa_csmr_estado_v20_2c', 'reservation_test_mode') | default(true) | bool(true) }}
          ledger: >-
            {% set itens = state_attr('sensor.casa_csmr_estado_v20_2c', 'transition_ledger') | default([], true) %}
            {{ itens if itens is iterable and itens is not string and itens is not mapping else [] }}
          request_matches: >-
            {{ ledger | selectattr('request_id', 'eq', request_id_norm) | list }}
          original: "{{ request_matches[0] if request_matches | count > 0 else dict() }}"
          validation_reason: >-
            {% if action is not defined %}missing_action
            {% elif action is not string %}invalid_action_type
            {% elif action_norm not in ['open', 'close', 'recover', 'reserve', 'cancel_reservation'] %}invalid_action
            {% elif request_id is not defined %}missing_request_id
            {% elif request_id is not string %}invalid_request_id_type
            {% elif request_id_norm == '' %}empty_request_id
            {% elif not request_id_norm | regex_match(uuid_pattern) %}invalid_request_id_format
            {% elif source is defined and source is not string %}invalid_source_type
            {% elif test_mode is not defined %}missing_test_mode
            {% elif test_mode is not boolean %}invalid_test_mode_type
            {% elif test_mode_raw and source_norm != 'harness_i2' %}unauthorized_test_source
            {% elif not test_mode_raw and source_norm != 'csmr_dispatcher_v20_2c' %}unauthorized_operational_source
            {% elif simulate_failure is defined and simulate_failure is not boolean %}invalid_simulate_failure_type
            {% elif not test_mode_raw and simulate_failure_raw %}simulation_forbidden_in_operational_mode
            {% elif session_id is defined and session_id is not string %}invalid_session_id_type
            {% elif requested_session_id != '' and not requested_session_id | regex_match(uuid_pattern) %}invalid_session_id_format
            {% else %}valid{% endif %}
          generated_hex: "{{ md5(context.id ~ now().isoformat() ~ request_id_norm) }}"
          generated_session_id: >-
            {{ generated_hex[0:8] ~ '-' ~ generated_hex[8:12] ~ '-4' ~ generated_hex[13:16]
               ~ '-8' ~ generated_hex[17:20] ~ '-' ~ generated_hex[20:32] }}
          open_session_id: "{{ reserved_session_id if session_reserved else generated_session_id }}"
          call_started_at: "{{ now().isoformat() }}"

      - choose:
          - conditions: "{{ validation_reason != 'valid' }}"
            sequence:
              - variables:
                  response:
                    request_id: "{{ request_id_norm }}"
                    action: "{{ action_norm }}"
                    status: rejected
                    state: "{{ current_state }}"
                    session_id: "{{ current_session_id }}"
                    reason: "{{ validation_reason }}"
                    processed_at: "{{ now().isoformat() }}"
              - stop: Comando CSMR rejeitado por contrato.
                response_variable: response

          - conditions: "{{ request_matches | count > 0 }}"
            sequence:
              - variables:
                  response:
                    request_id: "{{ request_id_norm }}"
                    action: "{{ action_norm }}"
                    status: duplicate
                    state: "{{ current_state }}"
                    session_id: "{{ original.session_id | default(current_session_id, true) }}"
                    reason: same_request_id
                    original_result: "{{ original.result | default('', true) }}"
                    original_processed_at: "{{ original.processed_at | default('', true) }}"
                    processed_at: "{{ now().isoformat() }}"
              - stop: Transição CSMR já processada.
                response_variable: response

          - conditions: "{{ action_norm == 'reserve' and current_state != 'idle' }}"
            sequence:
              - variables:
                  response:
                    request_id: "{{ request_id_norm }}"
                    action: reserve
                    status: rejected
                    state: "{{ current_state }}"
                    session_id: "{{ current_session_id }}"
                    reason: invalid_transition
                    processed_at: "{{ now().isoformat() }}"
              - stop: Reserva exige estado idle.
                response_variable: response

          - conditions: "{{ action_norm == 'reserve' and session_reserved }}"
            sequence:
              - variables:
                  response:
                    request_id: "{{ request_id_norm }}"
                    action: reserve
                    status: rejected
                    state: idle
                    session_id: "{{ reserved_session_id }}"
                    reason: reservation_exists
                    reservation_request_id: "{{ reservation_request_id }}"
                    processed_at: "{{ now().isoformat() }}"
              - stop: Já existe reserva corrente.
                response_variable: response

          - conditions: "{{ action_norm == 'cancel_reservation' and (current_state != 'idle' or not session_reserved) }}"
            sequence:
              - variables:
                  response:
                    request_id: "{{ request_id_norm }}"
                    action: cancel_reservation
                    status: rejected
                    state: "{{ current_state }}"
                    session_id: "{{ reserved_session_id }}"
                    reason: "{{ 'invalid_transition' if current_state != 'idle' else 'no_reservation' }}"
                    processed_at: "{{ now().isoformat() }}"
              - stop: Não há reserva cancelável.
                response_variable: response

          - conditions: >-
              {{ action_norm == 'cancel_reservation'
                 and (source_norm != reservation_source or test_mode_raw != reservation_test_mode) }}
            sequence:
              - variables:
                  response:
                    request_id: "{{ request_id_norm }}"
                    action: cancel_reservation
                    status: rejected
                    state: idle
                    session_id: "{{ reserved_session_id }}"
                    reason: reservation_authority_mismatch
                    processed_at: "{{ now().isoformat() }}"
              - stop: Origem não corresponde à reserva.
                response_variable: response

          - conditions: >-
              {{ action_norm == 'cancel_reservation'
                 and requested_session_id != '' and requested_session_id != reserved_session_id }}
            sequence:
              - variables:
                  response:
                    request_id: "{{ request_id_norm }}"
                    action: cancel_reservation
                    status: rejected
                    state: idle
                    session_id: "{{ reserved_session_id }}"
                    reason: reservation_session_mismatch
                    processed_at: "{{ now().isoformat() }}"
              - stop: Session ID não corresponde à reserva.
                response_variable: response

          - conditions: "{{ action_norm == 'open' and current_state != 'idle' }}"
            sequence:
              - variables:
                  response:
                    request_id: "{{ request_id_norm }}"
                    action: open
                    status: rejected
                    state: "{{ current_state }}"
                    session_id: "{{ current_session_id }}"
                    reason: "{{ 'session_already_active' if current_state == 'active' else 'invalid_transition' }}"
                    processed_at: "{{ now().isoformat() }}"
              - stop: Abertura incompatível com o estado atual.
                response_variable: response

          - conditions: "{{ action_norm == 'open' and not test_mode_raw and not session_reserved }}"
            sequence:
              - variables:
                  response:
                    request_id: "{{ request_id_norm }}"
                    action: open
                    status: rejected
                    state: idle
                    session_id: ""
                    reason: operational_open_requires_reservation
                    processed_at: "{{ now().isoformat() }}"
              - stop: Open produtivo exige reserva.
                response_variable: response

          - conditions: >-
              {{ action_norm == 'open' and session_reserved
                 and (source_norm != reservation_source or test_mode_raw != reservation_test_mode) }}
            sequence:
              - variables:
                  response:
                    request_id: "{{ request_id_norm }}"
                    action: open
                    status: rejected
                    state: idle
                    session_id: "{{ reserved_session_id }}"
                    reason: reservation_authority_mismatch
                    processed_at: "{{ now().isoformat() }}"
              - stop: Origem não corresponde à reserva.
                response_variable: response

          - conditions: >-
              {{ action_norm == 'open' and session_reserved
                 and requested_session_id != reserved_session_id }}
            sequence:
              - variables:
                  response:
                    request_id: "{{ request_id_norm }}"
                    action: open
                    status: rejected
                    state: idle
                    session_id: "{{ reserved_session_id }}"
                    reason: reservation_session_mismatch
                    processed_at: "{{ now().isoformat() }}"
              - stop: Open não confirmou o UUID reservado.
                response_variable: response

          - conditions: "{{ action_norm == 'close' and current_state != 'active' }}"
            sequence:
              - variables:
                  response:
                    request_id: "{{ request_id_norm }}"
                    action: close
                    status: rejected
                    state: "{{ current_state }}"
                    session_id: "{{ current_session_id }}"
                    reason: "{{ 'no_active_session' if current_state == 'idle' else 'invalid_transition' }}"
                    processed_at: "{{ now().isoformat() }}"
              - stop: Encerramento incompatível com o estado atual.
                response_variable: response

          - conditions: "{{ action_norm == 'recover' and current_state != 'failed' }}"
            sequence:
              - variables:
                  response:
                    request_id: "{{ request_id_norm }}"
                    action: recover
                    status: rejected
                    state: "{{ current_state }}"
                    session_id: "{{ current_session_id }}"
                    reason: recovery_requires_failed
                    processed_at: "{{ now().isoformat() }}"
              - stop: Recuperação exige estado failed.
                response_variable: response

        default:
          - choose:
              - conditions: "{{ action_norm == 'reserve' }}"
                sequence:
                  - event: casa_csmr_checkpoint_v20_2c
                    event_data:
                      state: idle
                      session_id: ""
                      started_at: ""
                      ended_at: "{{ current_ended_at }}"
                      transition_started_at: "{{ now().isoformat() }}"
                      last_transition_at: "{{ now().isoformat() }}"
                      transition_request_id: "{{ request_id_norm }}"
                      transition_action: reserve
                      transition_reason: "{{ reason_norm }}"
                      transition_source: "{{ source_norm }}"
                      previous_state: idle
                      last_consistent_state: idle
                      last_error: ""
                      last_session_id: "{{ current_last_session_id }}"
                      session_reserved: true
                      reserved_session_id: "{{ generated_session_id }}"
                      reservation_request_id: "{{ request_id_norm }}"
                      reserved_at: "{{ now().isoformat() }}"
                      reservation_source: "{{ source_norm }}"
                      reservation_reason: "{{ reason_norm }}"
                      reservation_test_mode: "{{ test_mode_raw }}"
                      consumed_reservation_request_id: ""
                      test_mode: "{{ test_mode_raw }}"
                      result: reserved
                      ledger_session_id: "{{ generated_session_id }}"
                      append_ledger: true

              - conditions: "{{ action_norm == 'cancel_reservation' }}"
                sequence:
                  - event: casa_csmr_checkpoint_v20_2c
                    event_data:
                      state: idle
                      session_id: ""
                      started_at: ""
                      ended_at: "{{ current_ended_at }}"
                      transition_started_at: "{{ now().isoformat() }}"
                      last_transition_at: "{{ now().isoformat() }}"
                      transition_request_id: "{{ request_id_norm }}"
                      transition_action: cancel_reservation
                      transition_reason: "{{ reason_norm }}"
                      transition_source: "{{ source_norm }}"
                      previous_state: idle
                      last_consistent_state: idle
                      last_error: ""
                      last_session_id: "{{ reserved_session_id }}"
                      session_reserved: false
                      reserved_session_id: ""
                      reservation_request_id: ""
                      reserved_at: ""
                      reservation_source: ""
                      reservation_reason: ""
                      reservation_test_mode: true
                      consumed_reservation_request_id: ""
                      test_mode: "{{ test_mode_raw }}"
                      result: cancelled
                      ledger_session_id: "{{ reserved_session_id }}"
                      append_ledger: true

              - conditions: "{{ action_norm == 'open' }}"
                sequence:
                  - event: casa_csmr_checkpoint_v20_2c
                    event_data:
                      state: starting
                      session_id: "{{ open_session_id }}"
                      started_at: ""
                      ended_at: ""
                      transition_started_at: "{{ now().isoformat() }}"
                      last_transition_at: "{{ now().isoformat() }}"
                      transition_request_id: "{{ request_id_norm }}"
                      transition_action: open
                      transition_reason: "{{ reason_norm }}"
                      transition_source: "{{ source_norm }}"
                      previous_state: idle
                      last_consistent_state: idle
                      last_error: ""
                      last_session_id: "{{ current_last_session_id }}"
                      session_reserved: false
                      reserved_session_id: ""
                      reservation_request_id: ""
                      reserved_at: ""
                      reservation_source: ""
                      reservation_reason: ""
                      reservation_test_mode: true
                      consumed_reservation_request_id: "{{ reservation_request_id if session_reserved else '' }}"
                      test_mode: "{{ test_mode_raw }}"
                      result: pending
                      append_ledger: false
                  - delay:
                      milliseconds: 100
                  - choose:
                      - conditions: "{{ simulate_failure_raw }}"
                        sequence:
                          - event: casa_csmr_checkpoint_v20_2c
                            event_data:
                              state: failed
                              session_id: "{{ open_session_id }}"
                              started_at: ""
                              ended_at: ""
                              transition_started_at: "{{ call_started_at }}"
                              last_transition_at: "{{ now().isoformat() }}"
                              transition_request_id: "{{ request_id_norm }}"
                              transition_action: open
                              transition_reason: "{{ reason_norm }}"
                              transition_source: "{{ source_norm }}"
                              previous_state: starting
                              last_consistent_state: idle
                              last_error: simulated_open_failure
                              last_session_id: "{{ current_last_session_id }}"
                              result: failed
                              append_ledger: true
                    default:
                      - event: casa_csmr_checkpoint_v20_2c
                        event_data:
                          state: active
                          session_id: "{{ open_session_id }}"
                          started_at: "{{ now().isoformat() }}"
                          ended_at: ""
                          transition_started_at: "{{ call_started_at }}"
                          last_transition_at: "{{ now().isoformat() }}"
                          transition_request_id: "{{ request_id_norm }}"
                          transition_action: open
                          transition_reason: "{{ reason_norm }}"
                          transition_source: "{{ source_norm }}"
                          previous_state: starting
                          last_consistent_state: active
                          last_error: ""
                          last_session_id: "{{ current_last_session_id }}"
                          result: completed
                          append_ledger: true

              - conditions: "{{ action_norm == 'close' }}"
                sequence:
                  - event: casa_csmr_checkpoint_v20_2c
                    event_data:
                      state: ending
                      session_id: "{{ current_session_id }}"
                      started_at: "{{ current_started_at }}"
                      ended_at: ""
                      transition_started_at: "{{ now().isoformat() }}"
                      last_transition_at: "{{ now().isoformat() }}"
                      transition_request_id: "{{ request_id_norm }}"
                      transition_action: close
                      transition_reason: "{{ reason_norm }}"
                      transition_source: "{{ source_norm }}"
                      test_mode: "{{ test_mode_raw }}"
                      previous_state: active
                      last_consistent_state: active
                      last_error: ""
                      last_session_id: "{{ current_last_session_id }}"
                      result: pending
                      append_ledger: false
                  - delay:
                      milliseconds: 100
                  - choose:
                      - conditions: "{{ simulate_failure_raw }}"
                        sequence:
                          - event: casa_csmr_checkpoint_v20_2c
                            event_data:
                              state: failed
                              session_id: "{{ current_session_id }}"
                              started_at: "{{ current_started_at }}"
                              ended_at: ""
                              transition_started_at: "{{ call_started_at }}"
                              last_transition_at: "{{ now().isoformat() }}"
                              transition_request_id: "{{ request_id_norm }}"
                              transition_action: close
                              transition_reason: "{{ reason_norm }}"
                              transition_source: "{{ source_norm }}"
                              test_mode: "{{ test_mode_raw }}"
                              previous_state: ending
                              last_consistent_state: active
                              last_error: simulated_close_failure
                              last_session_id: "{{ current_last_session_id }}"
                              result: failed
                              append_ledger: true
                    default:
                      - event: casa_csmr_checkpoint_v20_2c
                        event_data:
                          state: idle
                          session_id: ""
                          started_at: ""
                          ended_at: "{{ now().isoformat() }}"
                          transition_started_at: "{{ call_started_at }}"
                          last_transition_at: "{{ now().isoformat() }}"
                          transition_request_id: "{{ request_id_norm }}"
                          transition_action: close
                          transition_reason: "{{ reason_norm }}"
                          transition_source: "{{ source_norm }}"
                          test_mode: "{{ test_mode_raw }}"
                          previous_state: ending
                          last_consistent_state: idle
                          last_error: ""
                          last_session_id: "{{ current_session_id }}"
                          result: completed
                          append_ledger: true

              - conditions: "{{ action_norm == 'recover' }}"
                sequence:
                  - event: casa_csmr_checkpoint_v20_2c
                    event_data:
                      state: idle
                      session_id: ""
                      started_at: ""
                      ended_at: "{{ current_ended_at }}"
                      transition_started_at: "{{ now().isoformat() }}"
                      last_transition_at: "{{ now().isoformat() }}"
                      transition_request_id: "{{ request_id_norm }}"
                      transition_action: recover
                      transition_reason: "{{ reason_norm }}"
                      transition_source: "{{ source_norm }}"
                      test_mode: "{{ test_mode_raw }}"
                      previous_state: failed
                      last_consistent_state: idle
                      last_error: ""
                      last_session_id: "{{ current_session_id | default(current_last_session_id, true) }}"
                      result: recovered
                      append_ledger: true

          - wait_template: >-
              {{ state_attr('sensor.casa_csmr_estado_v20_2c', 'transition_request_id') == request_id_norm
                 and states('sensor.casa_csmr_estado_v20_2c') in ['idle', 'active', 'failed']
                 and as_timestamp(state_attr('sensor.casa_csmr_estado_v20_2c', 'last_transition_at'), 0)
                     >= as_timestamp(call_started_at, 0) }}
            timeout: "00:00:05"
            continue_on_timeout: true

          - variables:
              final_state: "{{ states('sensor.casa_csmr_estado_v20_2c') if wait.completed else 'failed' }}"
              final_session_id: >-
                {% if action_norm == 'reserve' %}
                  {{ state_attr('sensor.casa_csmr_estado_v20_2c', 'reserved_session_id') | default('', true) }}
                {% elif action_norm == 'cancel_reservation' %}
                  {{ reserved_session_id }}
                {% else %}
                  {{ state_attr('sensor.casa_csmr_estado_v20_2c', 'session_id')
                     | default(state_attr('sensor.casa_csmr_estado_v20_2c', 'last_session_id'), true) }}
                {% endif %}
              response:
                request_id: "{{ request_id_norm }}"
                action: "{{ action_norm }}"
                status: >-
                  {% if not wait.completed %}failed
                  {% elif final_state == 'failed' %}failed
                  {% elif action_norm == 'reserve' %}reserved
                  {% elif action_norm == 'cancel_reservation' %}cancelled
                  {% elif action_norm == 'recover' %}recovered
                  {% else %}completed{% endif %}
                state: "{{ final_state }}"
                session_id: "{{ final_session_id }}"
                reason: >-
                  {{ state_attr('sensor.casa_csmr_estado_v20_2c', 'last_error')
                     if wait.completed else 'checkpoint_timeout' }}
                processed_at: "{{ state_attr('sensor.casa_csmr_estado_v20_2c', 'last_transition_at') | default(now().isoformat(), true) }}"
          - stop: Transição CSMR processada pelo harness isolado.
            response_variable: response
