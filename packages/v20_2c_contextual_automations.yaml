###############################################################################
# V20.2C — Automações Contextuais Residenciais — C0/C1
#
# Harness de saída simulada com laboratório observacional e ação física
# controlada exclusivamente sobre light.luz_led_mesa.
###############################################################################

input_boolean:
  teste_v20_2_harness_ativo:
    name: V20.2C — Harness de Teste
    icon: mdi:test-tube
    initial: false

  teste_v20_2_simular_casa_vazia:
    name: V20.2C — Simular Casa Vazia
    icon: mdi:home-export-outline
    initial: false

input_number:
  teste_v20_2_tempo_graca_saida:
    name: V20.2C — Tempo de Graça da Saída
    icon: mdi:timer-sand
    min: 5
    max: 300
    step: 5
    unit_of_measurement: s
    initial: 15
    mode: box

template:
  - binary_sensor:
      - name: Casa Efetivamente Vazia
        unique_id: casa_efetivamente_vazia
        icon: mdi:home-outline
        state: >
          {{ is_state('input_boolean.teste_v20_2_harness_ativo', 'on')
             and is_state('input_boolean.teste_v20_2_simular_casa_vazia', 'on') }}
        attributes:
          source: >
            {{ 'simulation'
               if is_state('input_boolean.teste_v20_2_harness_ativo', 'on')
               else 'safe_fallback' }}
          test_mode: >
            {{ is_state('input_boolean.teste_v20_2_harness_ativo', 'on') }}
          simulation_requested: >
            {{ is_state('input_boolean.teste_v20_2_simular_casa_vazia', 'on') }}
          production_presence_available: >
            {{ states('binary_sensor.casa_presenca_global') in ['on', 'off'] }}
          shadow_sensor_state: >
            {{ states('binary_sensor.casa_vazia_v20_2') }}
          global_presence_state: >
            {{ states('binary_sensor.casa_presenca_global') }}
          physical_actions_allowed: false

automation:
  - id: v20_2c_laboratorio_saida_simulada
    alias: V20.2C — Laboratório — Saída Simulada
    description: Registra uma saída simulada sem executar qualquer ação física.
    mode: single

    trigger:
      - platform: state
        entity_id: binary_sensor.casa_efetivamente_vazia
        from: "off"
        to: "on"

    condition:
      - condition: state
        entity_id: input_boolean.teste_v20_2_harness_ativo
        state: "on"
      - condition: state
        entity_id: input_boolean.teste_v20_2_simular_casa_vazia
        state: "on"

    action:
      - service: logbook.log
        data:
          name: V20.2C — Laboratório
          message: >-
            🧪 V20.2C — Saída simulada detectada. Nenhuma ação física foi executada.
          entity_id: binary_sensor.casa_efetivamente_vazia

  - id: v20_2c_saida_teste_desligar_luz_mesa
    alias: V20.2C — Teste — Desligar Luz da Mesa após Saída
    description: >-
      Desliga somente a luz da mesa após graça e revalidação integral do
      harness de saída simulada.
    mode: restart

    trigger:
      - platform: state
        entity_id: binary_sensor.casa_efetivamente_vazia
        from: "off"
        to: "on"

    condition:
      - condition: state
        entity_id: input_boolean.teste_v20_2_harness_ativo
        state: "on"
      - condition: state
        entity_id: input_boolean.teste_v20_2_simular_casa_vazia
        state: "on"
      - condition: state
        entity_id: light.luz_led_mesa
        state: "on"

    action:
      - service: logbook.log
        data:
          name: V20.2C — Teste de Saída
          message: >-
            🧪 V20.2C — Saída simulada detectada. Tempo de graça iniciado.
          entity_id: light.luz_led_mesa

      - wait_for_trigger:
          - platform: state
            entity_id: input_boolean.teste_v20_2_harness_ativo
            to: "off"
          - platform: state
            entity_id: input_boolean.teste_v20_2_simular_casa_vazia
            to: "off"
          - platform: state
            entity_id: binary_sensor.casa_efetivamente_vazia
            to: "off"
        timeout:
          seconds: >-
            {{ states('input_number.teste_v20_2_tempo_graca_saida') | int(15) }}
        continue_on_timeout: true

      - condition: template
        alias: Tempo de graça concluído sem cancelamento
        value_template: "{{ not wait.completed }}"
      - condition: state
        entity_id: input_boolean.teste_v20_2_harness_ativo
        state: "on"
      - condition: state
        entity_id: input_boolean.teste_v20_2_simular_casa_vazia
        state: "on"
      - condition: state
        entity_id: binary_sensor.casa_efetivamente_vazia
        state: "on"
      - condition: state
        entity_id: light.luz_led_mesa
        state: "on"

      - service: light.turn_off
        target:
          entity_id: light.luz_led_mesa

      - service: logbook.log
        data:
          name: V20.2C — Teste de Saída
          message: >-
            🧪 V20.2C — Luz da mesa desligada após tempo de graça.
          entity_id: light.luz_led_mesa
