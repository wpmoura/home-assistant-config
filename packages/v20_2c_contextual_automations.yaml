###############################################################################
# V20.2C — Automações Contextuais Residenciais — C0/C1
#
# Harness de ausência simulada de Wilson, com laboratório observacional e ações
# já homologadas sobre a Luz Mesa e a Porta da Sala.
###############################################################################

input_boolean:
  teste_v20_2_harness_ativo:
    name: V20.2C — Harness de Teste
    icon: mdi:test-tube
    initial: false

  teste_v20_2_simular_wilson_ausente:
    name: V20.2C — Simular Wilson Ausente
    icon: mdi:account-arrow-right-outline
    initial: false

input_number:
  teste_v20_2_tempo_graca_saida:
    name: V20.2C — Tempo de Graça da Saída
    icon: mdi:timer-sand
    min: 5
    max: 300
    step: 5
    unit_of_measurement: s
    initial: 15
    mode: box

template:
  - binary_sensor:
      - name: Wilson Ausente de Casa
        unique_id: wilson_ausente_de_casa
        icon: mdi:account-arrow-right-outline
        state: >
          {% if is_state('input_boolean.teste_v20_2_harness_ativo', 'on') %}
            {{ is_state('input_boolean.teste_v20_2_simular_wilson_ausente', 'on') }}
          {% else %}
            {{ is_state('person.wmoura', 'not_home') }}
          {% endif %}
        attributes:
          source: >
            {% if is_state('input_boolean.teste_v20_2_harness_ativo', 'on') %}
              simulation
            {% elif states('person.wmoura') in ['home', 'not_home'] %}
              real
            {% else %}
              safe_fallback
            {% endif %}
          test_mode: >
            {{ is_state('input_boolean.teste_v20_2_harness_ativo', 'on') }}
          simulation_requested: >
            {{ is_state('input_boolean.teste_v20_2_simular_wilson_ausente', 'on') }}
          person_considered: person.wmoura
          wilson_tracker: "{{ state_attr('person.wmoura', 'source') | default('none', true) }}"
          wilson_state: "{{ states('person.wmoura') }}"
          critical_source_available: >
            {{ states('person.wmoura') in ['home', 'not_home'] }}
          jacira_state_observational: "{{ states('person.jacira_f_p_moura') }}"
          reason: >
            {% if is_state('input_boolean.teste_v20_2_harness_ativo', 'on') %}
              harness_controls_wilson_absence
            {% elif is_state('person.wmoura', 'not_home') %}
              wilson_is_away
            {% elif is_state('person.wmoura', 'home') %}
              wilson_is_home
            {% else %}
              wilson_state_unavailable_safe_fallback
            {% endif %}
          remote_monitoring_requested: >
            {% if is_state('input_boolean.teste_v20_2_harness_ativo', 'on') %}
              {{ is_state('input_boolean.teste_v20_2_simular_wilson_ausente', 'on') }}
            {% else %}
              {{ is_state('person.wmoura', 'not_home') }}
            {% endif %}

automation:
  - id: v20_2c_laboratorio_saida_simulada
    alias: V20.2C — Laboratório — Saída Simulada
    description: Registra uma saída simulada sem executar qualquer ação física.
    mode: single

    trigger:
      - platform: state
        entity_id: binary_sensor.wilson_ausente_de_casa
        from: "off"
        to: "on"

    condition:
      - condition: state
        entity_id: input_boolean.teste_v20_2_harness_ativo
        state: "on"
      - condition: state
        entity_id: input_boolean.teste_v20_2_simular_wilson_ausente
        state: "on"

    action:
      - service: logbook.log
        data:
          name: V20.2C — Laboratório
          message: >-
            🧪 V20.2C — Saída simulada detectada. Nenhuma ação física foi executada.
          entity_id: binary_sensor.wilson_ausente_de_casa

  - id: v20_2c_saida_teste_desligar_luz_mesa
    alias: V20.2C — Monitoramento — Desligar Luz da Mesa após Saída
    description: >-
      Desliga somente a luz da mesa quando o dispatcher autoriza consumidores
      de uma sessão CSMR operacionalmente elegível.
    mode: restart

    trigger:
      - platform: event
        event_type: casa_csmr_consumidores_autorizar_v20_2c

    condition:
      - condition: state
        alias: CSMR canonicamente ativo
        entity_id: sensor.casa_csmr_estado_v20_2c
        state: active
      - condition: state
        alias: Nenhum retorno pendente
        entity_id: input_boolean.casa_csmr_retorno_pendente_v20_2c
        state: "off"
      - condition: template
        alias: Sessão autorizada corresponde à sessão ativa
        value_template: >-
          {{ trigger.event.data.session_id | default('', true)
             == state_attr('sensor.casa_csmr_estado_v20_2c', 'session_id')
             and trigger.event.data.session_id | default('', true)
               == states('input_text.casa_csmr_consumidores_sessao_autorizada_v20_2c')
             and states('input_datetime.casa_csmr_consumidores_autorizados_desde_v20_2c') not in ['unknown', 'unavailable'] }}
      - condition: state
        entity_id: light.smart_lampada_wifi_1
        state: "on"

    action:
      - condition: state
        alias: CSMR permanece ativo
        entity_id: sensor.casa_csmr_estado_v20_2c
        state: active
      - condition: state
        alias: Retorno continua não pendente
        entity_id: input_boolean.casa_csmr_retorno_pendente_v20_2c
        state: "off"
      - condition: state
        entity_id: light.smart_lampada_wifi_1
        state: "on"

      - service: light.turn_off
        target:
          entity_id: light.smart_lampada_wifi_1

      - service: logbook.log
        data:
          name: V20.2C — Monitoramento Remoto
          message: >-
            V20.2C — Luz da mesa desligada após abertura canônica do CSMR.
          entity_id: light.smart_lampada_wifi_1

  - id: v20_2c_saida_teste_alertar_porta_aberta
    alias: V20.2C — Monitoramento — Alertar Porta Aberta após Saída
    description: >-
      Alerta quando a Porta da Sala for aberta durante sessão CSMR
      operacionalmente elegível.
    mode: restart

    trigger:
      - platform: state
        entity_id: binary_sensor.sensor_porta_sala_contact
        from: "off"
        to: "on"
        id: physical_door

      - platform: event
        event_type: casa_csmr_i4a_harness_porta
        id: harness_door

    condition:
      - condition: state
        alias: CSMR canonicamente ativo
        entity_id: sensor.casa_csmr_estado_v20_2c
        state: active
      - condition: state
        alias: Nenhum retorno pendente
        entity_id: input_boolean.casa_csmr_retorno_pendente_v20_2c
        state: "off"
      - condition: template
        alias: Evento pertence à sessão e ocorreu depois da autorização
        value_template: >-
          {% set active_session = state_attr('sensor.casa_csmr_estado_v20_2c', 'session_id') | default('', true) %}
          {% set authorized_session = states('input_text.casa_csmr_consumidores_sessao_autorizada_v20_2c') %}
          {% set authorized_since = states('input_datetime.casa_csmr_consumidores_autorizados_desde_v20_2c') %}
          {% set event_session = active_session if trigger.id == 'physical_door'
             else trigger.event.data.session_id | default('', true) %}
          {% set occurred_at = trigger.to_state.last_changed.isoformat() if trigger.id == 'physical_door'
             else trigger.event.data.occurred_at | default('', true) %}
          {{ active_session != ''
             and event_session == active_session
             and authorized_session == active_session
             and as_timestamp(authorized_since, 0) > 0
             and as_timestamp(occurred_at, 0) > as_timestamp(authorized_since, 0) }}

    action:
      - condition: state
        alias: CSMR permanece ativo
        entity_id: sensor.casa_csmr_estado_v20_2c
        state: active
      - condition: state
        alias: Retorno continua não pendente
        entity_id: input_boolean.casa_csmr_retorno_pendente_v20_2c
        state: "off"

      - service: logbook.log
        data:
          name: V20.2C — Monitoramento Remoto
          message: >-
            V20.2C — Porta da Sala permaneceu aberta após a saída de Wilson.
          entity_id: binary_sensor.sensor_porta_sala_contact

      - service: notify.mobile_app_iphonewm
        data:
          title: "V20.2C — Wilson Ausente"
          message: >-
            ⚠️ Porta da Sala permaneceu aberta após o tempo de graça.

  - id: v20_2c_garantir_push_porta_ao_sair
    alias: V20.2C — Garantia — Habilitar Push da Porta ao Sair
    description: >-
      Garante de forma idempotente que a automação homologada C1.2 esteja
      habilitada quando o dispatcher autoriza consumidores do CSMR.
    mode: restart

    trigger:
      - platform: event
        event_type: casa_csmr_consumidores_autorizar_v20_2c

    condition:
      - condition: state
        alias: CSMR canonicamente ativo
        entity_id: sensor.casa_csmr_estado_v20_2c
        state: active
      - condition: state
        alias: Nenhum retorno pendente
        entity_id: input_boolean.casa_csmr_retorno_pendente_v20_2c
        state: "off"
      - condition: template
        alias: Sessão autorizada corresponde à sessão ativa
        value_template: >-
          {{ trigger.event.data.session_id | default('', true)
               == state_attr('sensor.casa_csmr_estado_v20_2c', 'session_id')
             and trigger.event.data.session_id | default('', true)
               == states('input_text.casa_csmr_consumidores_sessao_autorizada_v20_2c')
             and states('input_datetime.casa_csmr_consumidores_autorizados_desde_v20_2c') not in ['unknown', 'unavailable'] }}

    action:
      - condition: state
        alias: CSMR permanece ativo
        entity_id: sensor.casa_csmr_estado_v20_2c
        state: active
      - condition: state
        alias: Retorno continua não pendente
        entity_id: input_boolean.casa_csmr_retorno_pendente_v20_2c
        state: "off"
      - condition: state
        alias: Push da Porta desabilitado
        entity_id: automation.v20_2c_teste_alertar_porta_aberta_apos_saida
        state: "off"

      - service: automation.turn_on
        target:
          entity_id: automation.v20_2c_teste_alertar_porta_aberta_apos_saida

      - service: logbook.log
        data:
          name: V20.2C — Monitoramento Remoto
          message: >-
            V20.2C — Push da Porta garantido após abertura canônica do CSMR.
          entity_id: automation.v20_2c_teste_alertar_porta_aberta_apos_saida

script:
  casa_csmr_consumidores_harness_porta_v20_2c:
    alias: Casa — CSMR — Harness Porta C1.2 V20.2C
    description: >-
      Injeta uma abertura lógica da porta para validar a autorização CSMR sem
      alterar o estado do sensor físico homologado.
    icon: mdi:test-tube
    mode: queued
    max: 10
    fields:
      session_id:
        name: Session ID
        required: true
        selector:
          text:
      occurred_at:
        name: Instante lógico da abertura
        required: true
        selector:
          text:
    sequence:
      - condition: template
        value_template: >-
          {{ session_id | default('', true) | string | trim != ''
             and as_timestamp(occurred_at | default('', true), 0) > 0 }}
      - event: casa_csmr_i4a_harness_porta
        event_data:
          session_id: "{{ session_id | trim }}"
          occurred_at: "{{ occurred_at | trim }}"
