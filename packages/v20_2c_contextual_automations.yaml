###############################################################################
# V20.2C — Automações Contextuais Residenciais — C0/C1
#
# Harness de ausência simulada de Wilson, com laboratório observacional e ações
# já homologadas sobre a Luz Mesa e a Porta da Sala.
###############################################################################

input_boolean:
  teste_v20_2_harness_ativo:
    name: V20.2C — Harness de Teste
    icon: mdi:test-tube
    initial: false

  teste_v20_2_simular_wilson_ausente:
    name: V20.2C — Simular Wilson Ausente
    icon: mdi:account-arrow-right-outline
    initial: false

input_number:
  teste_v20_2_tempo_graca_saida:
    name: V20.2C — Tempo de Graça da Saída
    icon: mdi:timer-sand
    min: 5
    max: 300
    step: 5
    unit_of_measurement: s
    initial: 15
    mode: box

template:
  - binary_sensor:
      # O unique_id legado é preservado para evitar entidade órfã no registry.
      - name: Wilson Ausente de Casa
        unique_id: casa_efetivamente_vazia
        icon: mdi:account-arrow-right-outline
        state: >
          {% if is_state('input_boolean.teste_v20_2_harness_ativo', 'on') %}
            {{ is_state('input_boolean.teste_v20_2_simular_wilson_ausente', 'on') }}
          {% else %}
            {{ is_state('person.wmoura', 'not_home') }}
          {% endif %}
        attributes:
          source: >
            {% if is_state('input_boolean.teste_v20_2_harness_ativo', 'on') %}
              simulation
            {% elif states('person.wmoura') in ['home', 'not_home'] %}
              real
            {% else %}
              safe_fallback
            {% endif %}
          test_mode: >
            {{ is_state('input_boolean.teste_v20_2_harness_ativo', 'on') }}
          simulation_requested: >
            {{ is_state('input_boolean.teste_v20_2_simular_wilson_ausente', 'on') }}
          person_considered: person.wmoura
          wilson_tracker: "{{ state_attr('person.wmoura', 'source') | default('none', true) }}"
          wilson_state: "{{ states('person.wmoura') }}"
          critical_source_available: >
            {{ states('person.wmoura') in ['home', 'not_home'] }}
          jacira_state_observational: "{{ states('person.jacira_f_p_moura') }}"
          reason: >
            {% if is_state('input_boolean.teste_v20_2_harness_ativo', 'on') %}
              harness_controls_wilson_absence
            {% elif is_state('person.wmoura', 'not_home') %}
              wilson_is_away
            {% elif is_state('person.wmoura', 'home') %}
              wilson_is_home
            {% else %}
              wilson_state_unavailable_safe_fallback
            {% endif %}
          remote_monitoring_requested: >
            {% if is_state('input_boolean.teste_v20_2_harness_ativo', 'on') %}
              {{ is_state('input_boolean.teste_v20_2_simular_wilson_ausente', 'on') }}
            {% else %}
              {{ is_state('person.wmoura', 'not_home') }}
            {% endif %}

automation:
  - id: v20_2c_laboratorio_saida_simulada
    alias: V20.2C — Laboratório — Saída Simulada
    description: Registra uma saída simulada sem executar qualquer ação física.
    mode: single

    trigger:
      - platform: state
        entity_id: binary_sensor.casa_efetivamente_vazia
        from: "off"
        to: "on"

    condition:
      - condition: state
        entity_id: input_boolean.teste_v20_2_harness_ativo
        state: "on"
      - condition: state
        entity_id: input_boolean.teste_v20_2_simular_wilson_ausente
        state: "on"

    action:
      - service: logbook.log
        data:
          name: V20.2C — Laboratório
          message: >-
            🧪 V20.2C — Saída simulada detectada. Nenhuma ação física foi executada.
          entity_id: binary_sensor.casa_efetivamente_vazia

  - id: v20_2c_saida_teste_desligar_luz_mesa
    alias: V20.2C — Monitoramento — Desligar Luz da Mesa após Saída
    description: >-
      Desliga somente a luz da mesa após graça e revalidação da ausência de
      Wilson, real ou simulada pelo harness.
    mode: restart

    trigger:
      - platform: state
        entity_id: binary_sensor.casa_efetivamente_vazia
        from: "off"
        to: "on"

    condition:
      - condition: state
        alias: Ausência de Wilson autorizada
        entity_id: binary_sensor.casa_efetivamente_vazia
        state: "on"
      - condition: state
        entity_id: light.smart_lampada_wifi_1
        state: "on"

    action:
      - service: logbook.log
        data:
          name: V20.2C — Monitoramento Remoto
          message: >-
            V20.2C — Wilson ausente. Tempo de graça iniciado.
          entity_id: light.smart_lampada_wifi_1

      - wait_for_trigger:
          - platform: state
            entity_id: binary_sensor.casa_efetivamente_vazia
            to: "off"
        timeout:
          seconds: >-
            {{ states('input_number.teste_v20_2_tempo_graca_saida') | int(15) }}
        continue_on_timeout: true

      - condition: template
        alias: Tempo de graça concluído sem cancelamento
        value_template: "{{ not wait.completed }}"
      - condition: state
        alias: Ausência de Wilson ainda autorizada
        entity_id: binary_sensor.casa_efetivamente_vazia
        state: "on"
      - condition: state
        entity_id: light.smart_lampada_wifi_1
        state: "on"

      - service: light.turn_off
        target:
          entity_id: light.smart_lampada_wifi_1

      - service: logbook.log
        data:
          name: V20.2C — Monitoramento Remoto
          message: >-
            🧪 V20.2C — Luz da mesa desligada após tempo de graça.
          entity_id: light.smart_lampada_wifi_1

  - id: v20_2c_saida_teste_alertar_porta_aberta
    alias: V20.2C — Monitoramento — Alertar Porta Aberta após Saída
    description: >-
      Alerta sobre a Porta da Sala aberta após a graça quando Wilson estiver
      ausente, por fonte real ou simulada pelo harness.
    mode: restart

    trigger:
      - platform: state
        entity_id: binary_sensor.casa_efetivamente_vazia
        from: "off"
        to: "on"

    condition:
      - condition: state
        alias: Ausência de Wilson autorizada
        entity_id: binary_sensor.casa_efetivamente_vazia
        state: "on"

    action:
      - wait_for_trigger:
          - platform: state
            entity_id: binary_sensor.casa_efetivamente_vazia
            to: "off"
        timeout:
          seconds: >-
            {{ states('input_number.teste_v20_2_tempo_graca_saida') | int(15) }}
        continue_on_timeout: true

      - condition: template
        alias: Tempo de graça concluído sem cancelamento
        value_template: "{{ not wait.completed }}"
      - condition: state
        alias: Ausência de Wilson ainda autorizada
        entity_id: binary_sensor.casa_efetivamente_vazia
        state: "on"
      - condition: state
        entity_id: binary_sensor.sensor_porta_sala_contact
        state: "on"

      - service: logbook.log
        data:
          name: V20.2C — Monitoramento Remoto
          message: >-
            V20.2C — Porta da Sala permaneceu aberta após a saída de Wilson.
          entity_id: binary_sensor.sensor_porta_sala_contact

      - service: notify.mobile_app_iphonewm
        data:
          title: "V20.2C — Wilson Ausente"
          message: >-
            ⚠️ Porta da Sala permaneceu aberta após o tempo de graça.
