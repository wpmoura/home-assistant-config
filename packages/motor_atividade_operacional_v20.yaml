###############################################################################
# Central Operacional V20 - Motor shadow de atividade operacional
#
# Fase V20.1N.4
# Produtor canonico shadow para atividade da casa.
# Nao altera aliases finais, Central V4, automacoes, scripts ou dashboards.
###############################################################################

input_boolean:
  atividade_tv_habilitada:
    name: Atividade TV Habilitada
    icon: mdi:television
    initial: true

  atividade_maquina_lavar_habilitada:
    name: Atividade Maquina Lavar Habilitada
    icon: mdi:washing-machine
    initial: true

  atividade_microondas_habilitada:
    name: Atividade Microondas Habilitada
    icon: mdi:microwave
    initial: true

input_number:
  atividade_tv_peso:
    name: Atividade TV Peso
    min: 0
    max: 100
    step: 5
    mode: slider
    unit_of_measurement: "%"
    icon: mdi:weight
    initial: 20

  atividade_maquina_lavar_peso:
    name: Atividade Maquina Lavar Peso
    min: 0
    max: 100
    step: 5
    mode: slider
    unit_of_measurement: "%"
    icon: mdi:weight
    initial: 45

  atividade_microondas_peso:
    name: Atividade Microondas Peso
    min: 0
    max: 100
    step: 5
    mode: slider
    unit_of_measurement: "%"
    icon: mdi:weight
    initial: 60

  atividade_microondas_potencia_minima:
    name: Atividade Microondas Potencia Minima
    min: 0
    max: 3000
    step: 10
    mode: box
    unit_of_measurement: "W"
    icon: mdi:flash
    initial: 100

  atividade_maquina_lavar_potencia_minima:
    name: Atividade Maquina Lavar Potencia Minima
    min: 0
    max: 1000
    step: 1
    mode: box
    unit_of_measurement: "W"
    icon: mdi:flash
    initial: 5

template:
  - sensor:

      - name: Casa Atividade Operacional V20
        unique_id: casa_atividade_operacional_v20
        icon: mdi:home-lightning-bolt
        state: >
          {% set invalid = ['unknown', 'unavailable', 'none', 'None', '', none] %}
          {% set estados_inativos = invalid + ['idle', 'Idle', 'desligada', 'Desligada', 'inativo', 'Inativo', 'finalizado', 'Finalizado', 'finalizada', 'Finalizada', 'parada', 'Parada', 'off', 'Off'] %}

          {% set tv_helper = states('input_boolean.atividade_tv_habilitada') %}
          {% set tv_habilitada = tv_helper != 'off' %}
          {% set tv_estado = states('media_player.lg_webos_tv_oled55g3psa') %}
          {% set tv_contexto = states('sensor.central_tv_contexto_fonte') %}
          {% set tv_ativa_player = tv_estado not in invalid + ['off', 'standby'] %}
          {% set tv_ativa_contexto = tv_contexto not in invalid + ['TV desligada'] %}
          {% set tv_ativa = tv_habilitada and (tv_ativa_player or tv_ativa_contexto) %}

          {% set maquina_helper = states('input_boolean.atividade_maquina_lavar_habilitada') %}
          {% set maquina_habilitada = maquina_helper != 'off' %}
          {% set maquina_estado = states('input_select.maquina_lavar_estado') %}
          {% set maquina_ciclo = is_state('input_boolean.maquina_lavar_ciclo_ativo', 'on') %}
          {% set maquina_potencia = states('sensor.maq_de_lavar_potencia') | float(states('sensor.maquina_lavar_potencia') | float(0)) %}
          {% set maquina_min = states('input_number.atividade_maquina_lavar_potencia_minima') | float(5) %}
          {% set maquina_ativa = maquina_habilitada and (maquina_ciclo or maquina_estado not in estados_inativos or maquina_potencia > maquina_min) %}

          {% set micro_helper = states('input_boolean.atividade_microondas_habilitada') %}
          {% set micro_habilitado = micro_helper != 'off' %}
          {% set micro_potencia = states('sensor.micro_ondas_potencia') | float(0) %}
          {% set micro_corrente = states('sensor.micro_ondas_corrente') | float(0) %}
          {% set micro_min = states('input_number.atividade_microondas_potencia_minima') | float(100) %}
          {% set micro_ativo = micro_habilitado and (micro_potencia > micro_min or micro_corrente > 1) %}

          {% set banho_estado = states('sensor.casa_banho_estado_v20') %}
          {% set banho_chuveiro = states('binary_sensor.movimento_alto_banheiro_occupancy') %}
          {% set banho_ativo = banho_estado == 'banho_detectado' or banho_chuveiro == 'on' %}
          {% set ativos = [micro_ativo, maquina_ativa, tv_ativa, banho_ativo] | select('eq', true) | list | count %}

          {% if ativos == 0 %}
            sem_atividade
          {% elif ativos > 1 %}
            multiatividade
          {% elif micro_ativo %}
            microondas_ativo
          {% elif maquina_ativa %}
            maquina_lavar_ativa
          {% elif tv_ativa %}
            tv_ativa
          {% elif banho_ativo %}
            banho_ativo
          {% else %}
            sem_atividade
          {% endif %}
        attributes:
          atividade_dominante: >
            {% set invalid = ['unknown', 'unavailable', 'none', 'None', '', none] %}
            {% set estados_inativos = invalid + ['idle', 'Idle', 'desligada', 'Desligada', 'inativo', 'Inativo', 'finalizado', 'Finalizado', 'finalizada', 'Finalizada', 'parada', 'Parada', 'off', 'Off'] %}
            {% set tv_habilitada = states('input_boolean.atividade_tv_habilitada') != 'off' %}
            {% set tv_estado = states('media_player.lg_webos_tv_oled55g3psa') %}
            {% set tv_contexto = states('sensor.central_tv_contexto_fonte') %}
            {% set tv_ativa = tv_habilitada and (tv_estado not in invalid + ['off', 'standby'] or tv_contexto not in invalid + ['TV desligada']) %}
            {% set maquina_potencia = states('sensor.maq_de_lavar_potencia') | float(states('sensor.maquina_lavar_potencia') | float(0)) %}
            {% set maquina_ativa = states('input_boolean.atividade_maquina_lavar_habilitada') != 'off' and (is_state('input_boolean.maquina_lavar_ciclo_ativo', 'on') or states('input_select.maquina_lavar_estado') not in estados_inativos or maquina_potencia > states('input_number.atividade_maquina_lavar_potencia_minima') | float(5)) %}
            {% set micro_ativo = states('input_boolean.atividade_microondas_habilitada') != 'off' and (states('sensor.micro_ondas_potencia') | float(0) > states('input_number.atividade_microondas_potencia_minima') | float(100) or states('sensor.micro_ondas_corrente') | float(0) > 1) %}
            {% set banho_ativo = states('sensor.casa_banho_estado_v20') == 'banho_detectado' or states('binary_sensor.movimento_alto_banheiro_occupancy') == 'on' %}
            {% if micro_ativo %}
              microondas
            {% elif maquina_ativa %}
              maquina_lavar
            {% elif tv_ativa %}
              tv
            {% elif banho_ativo %}
              banho
            {% else %}
              sem_atividade
            {% endif %}
          dominio: >
            {% set invalid = ['unknown', 'unavailable', 'none', 'None', '', none] %}
            {% set estados_inativos = invalid + ['idle', 'Idle', 'desligada', 'Desligada', 'inativo', 'Inativo', 'finalizado', 'Finalizado', 'finalizada', 'Finalizada', 'parada', 'Parada', 'off', 'Off'] %}
            {% set tv_ativa = states('input_boolean.atividade_tv_habilitada') != 'off' and (states('media_player.lg_webos_tv_oled55g3psa') not in invalid + ['off', 'standby'] or states('sensor.central_tv_contexto_fonte') not in invalid + ['TV desligada']) %}
            {% set maquina_potencia = states('sensor.maq_de_lavar_potencia') | float(states('sensor.maquina_lavar_potencia') | float(0)) %}
            {% set maquina_ativa = states('input_boolean.atividade_maquina_lavar_habilitada') != 'off' and (is_state('input_boolean.maquina_lavar_ciclo_ativo', 'on') or states('input_select.maquina_lavar_estado') not in estados_inativos or maquina_potencia > states('input_number.atividade_maquina_lavar_potencia_minima') | float(5)) %}
            {% set micro_ativo = states('input_boolean.atividade_microondas_habilitada') != 'off' and (states('sensor.micro_ondas_potencia') | float(0) > states('input_number.atividade_microondas_potencia_minima') | float(100) or states('sensor.micro_ondas_corrente') | float(0) > 1) %}
            {% set banho_ativo = states('sensor.casa_banho_estado_v20') == 'banho_detectado' or states('binary_sensor.movimento_alto_banheiro_occupancy') == 'on' %}
            {% set ativos = [micro_ativo, maquina_ativa, tv_ativa, banho_ativo] | select('eq', true) | list | count %}
            {% if ativos > 1 %}
              multiatividade
            {% elif micro_ativo %}
              microondas
            {% elif maquina_ativa %}
              maquina_lavar
            {% elif tv_ativa %}
              tv
            {% elif banho_ativo %}
              banho
            {% else %}
              sem_atividade
            {% endif %}
          origem: >
            {% set invalid = ['unknown', 'unavailable', 'none', 'None', '', none] %}
            {% set estados_inativos = invalid + ['idle', 'Idle', 'desligada', 'Desligada', 'inativo', 'Inativo', 'finalizado', 'Finalizado', 'finalizada', 'Finalizada', 'parada', 'Parada', 'off', 'Off'] %}
            {% set tv_ativa = states('input_boolean.atividade_tv_habilitada') != 'off' and (states('media_player.lg_webos_tv_oled55g3psa') not in invalid + ['off', 'standby'] or states('sensor.central_tv_contexto_fonte') not in invalid + ['TV desligada']) %}
            {% set maquina_potencia = states('sensor.maq_de_lavar_potencia') | float(states('sensor.maquina_lavar_potencia') | float(0)) %}
            {% set maquina_ativa = states('input_boolean.atividade_maquina_lavar_habilitada') != 'off' and (is_state('input_boolean.maquina_lavar_ciclo_ativo', 'on') or states('input_select.maquina_lavar_estado') not in estados_inativos or maquina_potencia > states('input_number.atividade_maquina_lavar_potencia_minima') | float(5)) %}
            {% set micro_ativo = states('input_boolean.atividade_microondas_habilitada') != 'off' and (states('sensor.micro_ondas_potencia') | float(0) > states('input_number.atividade_microondas_potencia_minima') | float(100) or states('sensor.micro_ondas_corrente') | float(0) > 1) %}
            {% set banho_ativo = states('sensor.casa_banho_estado_v20') == 'banho_detectado' or states('binary_sensor.movimento_alto_banheiro_occupancy') == 'on' %}
            {% if micro_ativo %}
              sensor.micro_ondas_potencia
            {% elif maquina_ativa %}
              input_select.maquina_lavar_estado
            {% elif tv_ativa and states('media_player.lg_webos_tv_oled55g3psa') not in invalid + ['off', 'standby'] %}
              media_player.lg_webos_tv_oled55g3psa
            {% elif tv_ativa %}
              sensor.central_tv_contexto_fonte
            {% elif banho_ativo %}
              sensor.casa_banho_estado_v20
            {% else %}
              motor_atividade_operacional_v20
            {% endif %}
          ativo: >
            {{ states('sensor.casa_atividade_operacional_v20') not in ['sem_atividade', 'unknown', 'unavailable', 'none', 'None', '', none] }}
          prioridade: >
            {% set invalid = ['unknown', 'unavailable', 'none', 'None', '', none] %}
            {% set estados_inativos = invalid + ['idle', 'Idle', 'desligada', 'Desligada', 'inativo', 'Inativo', 'finalizado', 'Finalizado', 'finalizada', 'Finalizada', 'parada', 'Parada', 'off', 'Off'] %}
            {% set tv_ativa = states('input_boolean.atividade_tv_habilitada') != 'off' and (states('media_player.lg_webos_tv_oled55g3psa') not in invalid + ['off', 'standby'] or states('sensor.central_tv_contexto_fonte') not in invalid + ['TV desligada']) %}
            {% set maquina_potencia = states('sensor.maq_de_lavar_potencia') | float(states('sensor.maquina_lavar_potencia') | float(0)) %}
            {% set maquina_ativa = states('input_boolean.atividade_maquina_lavar_habilitada') != 'off' and (is_state('input_boolean.maquina_lavar_ciclo_ativo', 'on') or states('input_select.maquina_lavar_estado') not in estados_inativos or maquina_potencia > states('input_number.atividade_maquina_lavar_potencia_minima') | float(5)) %}
            {% set micro_ativo = states('input_boolean.atividade_microondas_habilitada') != 'off' and (states('sensor.micro_ondas_potencia') | float(0) > states('input_number.atividade_microondas_potencia_minima') | float(100) or states('sensor.micro_ondas_corrente') | float(0) > 1) %}
            {% set banho_ativo = states('sensor.casa_banho_estado_v20') == 'banho_detectado' or states('binary_sensor.movimento_alto_banheiro_occupancy') == 'on' %}
            {% if micro_ativo %}
              {% set rel = states('input_number.atividade_microondas_peso') | int(60) %}
            {% elif maquina_ativa %}
              {% set rel = states('input_number.atividade_maquina_lavar_peso') | int(45) %}
            {% elif tv_ativa %}
              {% set rel = states('input_number.atividade_tv_peso') | int(20) %}
            {% elif banho_ativo %}
              {% set rel = 50 %}
            {% else %}
              {% set rel = 0 %}
            {% endif %}
            {% if rel >= 90 %}
              critica
            {% elif rel >= 70 %}
              alta
            {% elif rel >= 40 %}
              media
            {% elif rel > 0 %}
              informativa
            {% else %}
              normal
            {% endif %}
          relevancia_local: >
            {% set invalid = ['unknown', 'unavailable', 'none', 'None', '', none] %}
            {% set estados_inativos = invalid + ['idle', 'Idle', 'desligada', 'Desligada', 'inativo', 'Inativo', 'finalizado', 'Finalizado', 'finalizada', 'Finalizada', 'parada', 'Parada', 'off', 'Off'] %}
            {% set tv_ativa = states('input_boolean.atividade_tv_habilitada') != 'off' and (states('media_player.lg_webos_tv_oled55g3psa') not in invalid + ['off', 'standby'] or states('sensor.central_tv_contexto_fonte') not in invalid + ['TV desligada']) %}
            {% set maquina_potencia = states('sensor.maq_de_lavar_potencia') | float(states('sensor.maquina_lavar_potencia') | float(0)) %}
            {% set maquina_ativa = states('input_boolean.atividade_maquina_lavar_habilitada') != 'off' and (is_state('input_boolean.maquina_lavar_ciclo_ativo', 'on') or states('input_select.maquina_lavar_estado') not in estados_inativos or maquina_potencia > states('input_number.atividade_maquina_lavar_potencia_minima') | float(5)) %}
            {% set micro_ativo = states('input_boolean.atividade_microondas_habilitada') != 'off' and (states('sensor.micro_ondas_potencia') | float(0) > states('input_number.atividade_microondas_potencia_minima') | float(100) or states('sensor.micro_ondas_corrente') | float(0) > 1) %}
            {% if micro_ativo %}
              {{ states('input_number.atividade_microondas_peso') | int(60) }}
            {% elif maquina_ativa %}
              {{ states('input_number.atividade_maquina_lavar_peso') | int(45) }}
            {% elif tv_ativa %}
              {{ states('input_number.atividade_tv_peso') | int(20) }}
            {% elif states('sensor.casa_banho_estado_v20') == 'banho_detectado' or states('binary_sensor.movimento_alto_banheiro_occupancy') == 'on' %}
              50
            {% else %}
              0
            {% endif %}
          timestamp: "{{ now().isoformat() }}"
          atividades_ativas: >
            {% set invalid = ['unknown', 'unavailable', 'none', 'None', '', none] %}
            {% set estados_inativos = invalid + ['idle', 'Idle', 'desligada', 'Desligada', 'inativo', 'Inativo', 'finalizado', 'Finalizado', 'finalizada', 'Finalizada', 'parada', 'Parada', 'off', 'Off'] %}
            {% set ns = namespace(items=[]) %}

            {% set tv_estado = states('media_player.lg_webos_tv_oled55g3psa') %}
            {% set tv_contexto = states('sensor.central_tv_contexto_fonte') %}
            {% set tv_titulo = state_attr('media_player.lg_webos_tv_oled55g3psa', 'media_title') %}
            {% set tv_canal = state_attr('media_player.lg_webos_tv_oled55g3psa', 'media_channel') %}
            {% set tv_app = state_attr('media_player.lg_webos_tv_oled55g3psa', 'app_name') %}
            {% set tv_source = state_attr('media_player.lg_webos_tv_oled55g3psa', 'source') %}
            {% set tv_invalid = invalid + ['Live', 'Live TV', 'playing', 'on'] %}
            {% if tv_titulo not in tv_invalid %}
              {% set tv_ui = 'TV: ' ~ tv_titulo %}
              {% set tv_fonte = 'media_title' %}
            {% elif tv_canal not in tv_invalid %}
              {% set tv_ui = 'TV: ' ~ tv_canal %}
              {% set tv_fonte = 'media_channel' %}
            {% elif tv_app not in tv_invalid %}
              {% set tv_ui = 'TV: ' ~ tv_app %}
              {% set tv_fonte = 'app_name' %}
            {% elif tv_source not in tv_invalid %}
              {% set tv_ui = 'TV: ' ~ tv_source %}
              {% set tv_fonte = 'source' %}
            {% elif tv_contexto not in tv_invalid + ['TV desligada'] %}
              {% set tv_ui = tv_contexto %}
              {% set tv_fonte = 'central_tv_contexto_fonte' %}
            {% else %}
              {% set tv_ui = 'TV ligada' %}
              {% set tv_fonte = 'fallback' %}
            {% endif %}
            {% set tv_ativa = states('input_boolean.atividade_tv_habilitada') != 'off' and (tv_estado not in invalid + ['off', 'standby'] or tv_contexto not in invalid + ['TV desligada']) %}
            {% if tv_ativa %}
              {% set ns.items = ns.items + [dict(dominio='tv', state='tv_ativa', ativo=true, titulo_ui=tv_ui, detalhe=tv_ui, prioridade='informativa', relevancia_local=states('input_number.atividade_tv_peso') | int(20), origem='media_player.lg_webos_tv_oled55g3psa' if tv_estado not in invalid + ['off', 'standby'] else 'sensor.central_tv_contexto_fonte', fonte=tv_fonte)] %}
            {% endif %}

            {% set maquina_estado = states('input_select.maquina_lavar_estado') %}
            {% set maquina_potencia = states('sensor.maq_de_lavar_potencia') | float(states('sensor.maquina_lavar_potencia') | float(0)) %}
            {% set maquina_ativa = states('input_boolean.atividade_maquina_lavar_habilitada') != 'off' and (is_state('input_boolean.maquina_lavar_ciclo_ativo', 'on') or maquina_estado not in estados_inativos or maquina_potencia > states('input_number.atividade_maquina_lavar_potencia_minima') | float(5)) %}
            {% if maquina_ativa %}
              {% set maq_rel = states('input_number.atividade_maquina_lavar_peso') | int(45) %}
              {% set ns.items = ns.items + [dict(dominio='maquina_lavar', state='maquina_lavar_ativa', ativo=true, titulo_ui='Maquina de lavar: ' ~ maquina_estado, detalhe='Estado=' ~ maquina_estado ~ '; potencia=' ~ (maquina_potencia | round(1)) ~ ' W', prioridade='media' if maq_rel >= 40 else 'informativa', relevancia_local=maq_rel, origem='input_select.maquina_lavar_estado', fonte='estado_ciclo_potencia')] %}
            {% endif %}

            {% set micro_potencia = states('sensor.micro_ondas_potencia') | float(0) %}
            {% set micro_corrente = states('sensor.micro_ondas_corrente') | float(0) %}
            {% set micro_ativo = states('input_boolean.atividade_microondas_habilitada') != 'off' and (micro_potencia > states('input_number.atividade_microondas_potencia_minima') | float(100) or micro_corrente > 1) %}
            {% if micro_ativo %}
              {% set micro_rel = states('input_number.atividade_microondas_peso') | int(60) %}
              {% set ns.items = ns.items + [dict(dominio='microondas', state='microondas_ativo', ativo=true, titulo_ui='Microondas em uso', detalhe='Potencia=' ~ (micro_potencia | round(1)) ~ ' W; corrente=' ~ (micro_corrente | round(2)) ~ ' A', prioridade='media' if micro_rel >= 40 else 'informativa', relevancia_local=micro_rel, origem='sensor.micro_ondas_potencia', fonte='potencia_corrente')] %}
            {% endif %}

            {% set banho_estado = states('sensor.casa_banho_estado_v20') %}
            {% set banho_chuveiro = states('binary_sensor.movimento_alto_banheiro_occupancy') %}
            {% set banho_ativo = banho_estado == 'banho_detectado' or banho_chuveiro == 'on' %}
            {% if banho_ativo %}
              {% set banho_rel = 50 %}
              {% set banho_titulo = 'Banho em encerramento' if banho_chuveiro == 'off' and banho_estado == 'banho_detectado' else 'Banho em andamento' %}
              {% set ns.items = ns.items + [dict(dominio='banho', state='banho_ativo', ativo=true, titulo_ui=banho_titulo, detalhe='Estado=' ~ banho_estado ~ '; chuveiro=' ~ banho_chuveiro, prioridade='media' if banho_rel >= 40 else 'informativa', relevancia_local=banho_rel, origem='sensor.casa_banho_estado_v20', fonte='chuveiro_janela_encerramento')] %}
            {% endif %}

            {{ ns.items | to_json }}
          atividades_secundarias: >
            {% set invalid = ['unknown', 'unavailable', 'none', 'None', '', none] %}
            {% set estados_inativos = invalid + ['idle', 'Idle', 'desligada', 'Desligada', 'inativo', 'Inativo', 'finalizado', 'Finalizado', 'finalizada', 'Finalizada', 'parada', 'Parada', 'off', 'Off'] %}
            {% set tv_ativa = states('input_boolean.atividade_tv_habilitada') != 'off' and (states('media_player.lg_webos_tv_oled55g3psa') not in invalid + ['off', 'standby'] or states('sensor.central_tv_contexto_fonte') not in invalid + ['TV desligada']) %}
            {% set maquina_potencia = states('sensor.maq_de_lavar_potencia') | float(states('sensor.maquina_lavar_potencia') | float(0)) %}
            {% set maquina_ativa = states('input_boolean.atividade_maquina_lavar_habilitada') != 'off' and (is_state('input_boolean.maquina_lavar_ciclo_ativo', 'on') or states('input_select.maquina_lavar_estado') not in estados_inativos or maquina_potencia > states('input_number.atividade_maquina_lavar_potencia_minima') | float(5)) %}
            {% set micro_ativo = states('input_boolean.atividade_microondas_habilitada') != 'off' and (states('sensor.micro_ondas_potencia') | float(0) > states('input_number.atividade_microondas_potencia_minima') | float(100) or states('sensor.micro_ondas_corrente') | float(0) > 1) %}
            {% set banho_ativo = states('sensor.casa_banho_estado_v20') == 'banho_detectado' or states('binary_sensor.movimento_alto_banheiro_occupancy') == 'on' %}
            {% if micro_ativo %}
              {% set dominante = 'microondas' %}
            {% elif maquina_ativa %}
              {% set dominante = 'maquina_lavar' %}
            {% elif tv_ativa %}
              {% set dominante = 'tv' %}
            {% elif banho_ativo %}
              {% set dominante = 'banho' %}
            {% else %}
              {% set dominante = 'sem_atividade' %}
            {% endif %}
            {% set todos = [] %}
            {% if micro_ativo %}{% set todos = todos + ['microondas'] %}{% endif %}
            {% if maquina_ativa %}{% set todos = todos + ['maquina_lavar'] %}{% endif %}
            {% if tv_ativa %}{% set todos = todos + ['tv'] %}{% endif %}
            {% if banho_ativo %}{% set todos = todos + ['banho'] %}{% endif %}
            {{ todos | reject('eq', dominante) | list | to_json }}
          assinatura_atividades: >
            {% set invalid = ['unknown', 'unavailable', 'none', 'None', '', none] %}
            {% set estados_inativos = invalid + ['idle', 'Idle', 'desligada', 'Desligada', 'inativo', 'Inativo', 'finalizado', 'Finalizado', 'finalizada', 'Finalizada', 'parada', 'Parada', 'off', 'Off'] %}
            {% set dominios = [] %}
            {% if states('input_boolean.atividade_microondas_habilitada') != 'off' and (states('sensor.micro_ondas_potencia') | float(0) > states('input_number.atividade_microondas_potencia_minima') | float(100) or states('sensor.micro_ondas_corrente') | float(0) > 1) %}
              {% set dominios = dominios + ['microondas'] %}
            {% endif %}
