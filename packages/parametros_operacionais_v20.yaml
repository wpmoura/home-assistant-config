###############################################################################
# Central Operacional V20.1 - Parametros complementares
#
# Helpers de preparacao para a matriz contextual de prioridade e para a camada
# de controle operacional da timeline/feed.
#
# Nao altera score, automacoes, dashboards produtivos ou entidades legadas.
###############################################################################

input_number:
  casa_peso_ups:
    name: Casa - Peso UPS
    min: 0
    max: 100
    step: 5
    mode: slider
    icon: mdi:battery-alert
    initial: 70

  casa_timeout_evento_minutos:
    name: Casa - Timeout Evento Minutos
    min: 1
    max: 60
    step: 1
    mode: slider
    unit_of_measurement: min
    icon: mdi:timer-sand
    initial: 5

  casa_confianca_minima_evento:
    name: Casa - Confianca Minima Evento
    min: 0
    max: 100
    step: 5
    mode: slider
    unit_of_measurement: "%"
    icon: mdi:shield-check-outline
    initial: 60

  casa_timeout_porta_aberta_minutos:
    name: Casa - Timeout Porta Aberta
    min: 1
    max: 60
    step: 1
    mode: slider
    unit_of_measurement: min
    icon: mdi:door-clock
    initial: 5

  casa_timeout_banho_minutos:
    name: Casa - Timeout banho
    min: 1
    max: 30
    step: 1
    mode: slider
    unit_of_measurement: min
    icon: mdi:shower-head
    initial: 2

  casa_timeline_max_eventos:
    name: Casa - Maximo de Eventos na Timeline
    min: 3
    max: 100
    step: 1
    mode: slider
    unit_of_measurement: eventos
    icon: mdi:format-list-numbered
    initial: 6

