home_office_religar_link_fibra_apos_10min:
  sequence:
  - delay:
      hours: 0
      minutes: 10
      seconds: 0
      milliseconds: 0
  - action: switch.turn_on
    target:
      entity_id: switch.mikrotik_ether1_port
    data: {}
  alias: Home office - Religar Link Fibra após 10min
  description: ''
#
#
desativar_alarme_modo_dormir:
  alias: Desativar Alarme com Código
  sequence:
    - service: alarm_control_panel.alarm_disarm
      data:
        entity_id: alarm_control_panel.home_alarm
        code: !secret codigo_alarme
#
#
acordar_wilson:
  alias: Acordar Wilson
  icon: mdi:weather-sunset-up
  sequence:
    # Desarma o alarme
    - service: alarm_control_panel.alarm_disarm
      data:
        entity_id: alarm_control_panel.home_alarm
        code: !secret codigo_alarme

    # Desliga o modo dormir
    - service: input_boolean.turn_off
      target:
        entity_id:
          - input_boolean.modo_dormir_ativo
          - input_boolean.wilson_dormindo

    # Liga luzes
    - service: light.turn_on
      target:
        entity_id:
          - light.quarto
          - light.corredor
      data:
        brightness_pct: 75

    # Liga ventilador (ou outro dispositivo)
    - service: switch.turn_on
      target:
        entity_id:
          - switch.ventilador_notebook

    # Notifica que acordou
    - service: notify.notify
      data:
        message: "Bom dia, Wilson! Você acordou, o alarme foi desarmado e a casa está pronta."

    # Atualiza log da última ativação (opcional)
    - service: input_text.set_value
      target:
        entity_id: input_text.ultima_ativacao_modo_dormir
      data:
        value: "Acordou em {{ now().strftime('%d/%m/%Y %H:%M:%S') }}"
