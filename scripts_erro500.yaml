teste:
  alias: Home office - Alexa - Let's rock
  sequence:
  - data:
      volume_level: 0.39
    action: media_player.volume_set
    target:
      entity_id: media_player.echo_show_de_wilson_2
  - data:
      message: Let's rock
      target: media_player.echo_show_de_wilson
      data:
        type: announce
    action: notify.alexa_media_echo_show_de_wilson
  mode: single
  icon: mdi:briefcase-clock-outline
'1691176415030':
  alias: Home office - Alexa - Good bye
  sequence:
  - data:
      volume_level: 0.15
    action: media_player.volume_set
    target:
      entity_id: media_player.echo_show_de_wilson_2
  - data:
      target: media_player.echo_show_de_wilson
      data:
        type: announce
      message: Good bye!!!!
    action: notify.alexa_media_echo_show_de_wilson
  - data: {}
    target:
      device_id: a7adec408cd485d7261d9ecd29ce5070
    action: media_player.media_stop
  mode: single
  icon: mdi:briefcase-variant-off
home_office_religar_link_fibra_apos_10min:
  sequence:
  - delay:
      hours: 0
      minutes: 10
      seconds: 0
      milliseconds: 0
  - action: switch.turn_on
    target:
      entity_id: switch.mikrotik_ether1_port
    data: {}
  alias: Home office - Religar Link Fibra após 10min
  description: ''
'1743352611708':
  alias: Anunciar via Alexa
  use_blueprint:
    path: lnpbr/anunciar_na_alexa.yaml
  description: ''
#
#
forcar_modo_dormir:
  alias: "Forçar Modo Dormir"
  sequence:
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.modo_dormir_ativo
#
#
desativar_alarme_modo_dormir:
  alias: Desativar Alarme com Código
  sequence:
    - service: alarm_control_panel.alarm_disarm
      data:
        entity_id: alarm_control_panel.home_alarm
        code: !secret codigo_alarme
#
#
acordar_wilson:
  alias: Acordar Wilson
  icon: mdi:weather-sunset-up
  sequence:
    # Desarma o alarme
    - service: alarm_control_panel.alarm_disarm
      data:
        entity_id: alarm_control_panel.home_alarm
        code: !secret codigo_alarme

    # Desliga o modo dormir
    - service: input_boolean.turn_off
      target:
        entity_id:
          - input_boolean.modo_dormir_ativo
          - input_boolean.wilson_dormindo

    # Liga luzes
    - service: light.turn_on
      target:
        entity_id:
          - light.quarto
          - light.corredor
      data:
        brightness_pct: 75

    # Liga ventilador (ou outro dispositivo)
    - service: switch.turn_on
      target:
        entity_id:
          - switch.ventilador_notebook

    # Notifica que acordou
    - service: notify.notify
      data:
        message: "Bom dia, Wilson! Você acordou, o alarme foi desarmado e a casa está pronta."

    # Atualiza log da última ativação (opcional)
    - service: input_text.set_value
      target:
        entity_id: input_text.ultima_ativacao_modo_dormir
      data:
        value: "Acordou em {{ now().strftime('%d/%m/%Y %H:%M:%S') }}"

#
#
teste_botao_acordar:
  alias: Teste Botão Acordar
  sequence:
    - service: notify.notify
      data:
        message: "Botão Acordar foi clicado"
