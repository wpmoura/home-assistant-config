teste:
  alias: Home office - Alexa - Let's rock
  sequence:
  - data:
      volume_level: 0.39
    action: media_player.volume_set
    target:
      entity_id: media_player.echo_show_de_wilson_2
  - data:
      message: Let's rock
      target: media_player.echo_show_de_wilson
      data:
        type: announce
    action: notify.alexa_media_echo_show_de_wilson
  mode: single
  icon: mdi:briefcase-clock-outline
inicio_do_trabalho:
  sequence:
  - service: light.turn_on
    data:
      color_temp: 421
      brightness_pct: 30
    target:
      entity_id:
      - light.smart_lampada_wifi_2
      - light.yeelight_lamp15_0xeccc7ee
      - light.yeelight_strip6_0x156f44f7
      - switch.regua_zigbee_br_l5
