# template_sensors.yaml
# inicio do primeiro arquivo 
# template_sensors.yaml
- sensor:
    # ====== SENSORES ORIGINAIS (MANTIDOS) ======
#

    # 📌 Luz Mesa (smart_lampada_wifi_1)
    - name: "luz_mesa_consumo_energia"
      unique_id: "luz_mesa_consumo_energia"
      friendly_name: "Consumo - Luz Mesa"
      unit_of_measurement: "kWh"
      device_class: "energy"
      state_class: total_increasing
      state: >
        {% if is_state('light.smart_lampada_wifi_1', 'on') %}
        {% set minutos = ((as_timestamp(now()) - as_timestamp(states.light.smart_lampada_wifi_1.last_changed)) / 60) | float(0) %}
        {{ (9 * minutos / 60000) | round(5) }}
        {% else %}
          0
        {% endif %}
- sensor:
   # 📌 Separando os pesos por pessoa
   
    - name: "Peso Moura"
      state: >
        {% set peso = states('sensor.mi_smart_scale_eda1_mass') | float(0) %}
        {% if 80 <= peso <= 100 %}
          {{ peso }}
        {% else %}
          N/A
        {% endif %}
      unit_of_measurement: "kg"

    - name: "Peso Jacira"
      state: >
        {% set peso = states('sensor.mi_smart_scale_eda1_mass') | float(0) %}
        {% if 50 <= peso <= 75 %}
          {{ peso }}
        {% else %}
          "Peso de outra pessoa"
        {% endif %}
      unit_of_measurement: "kg"
       
   # 📌 identicando a entrada de energia na tomada inteligente
   
    - name: "Energia Concessionaria"
      state: >-
        {% if states('sensor.ups_voltagem') == 'unavailable' %}
          off
        {% else %}
          on
        {% endif %}
       
   # 📌 Controlando o fluxo de dados do qbittorrent
   
    - name: "qBittorrent Sem Transferências"
      state: >
        {% if states('sensor.qbittorrent_download_speed') | float == 0 and
              states('sensor.qbittorrent_upload_speed') | float == 0 %}
          idle
        {% else %}
          active
        {% endif %}
      icon: mdi:download
       
   # 📌 Identificando a intensidade da chauva
   
    - name: "Intensidade da Chuva"
      unit_of_measurement: "Classificação"
      state: >
        {% set chuva_mv = states('sensor.sensor_chuva_girasol_rain_intensity') %}
        {% if chuva_mv | lower in ['unknown', 'unavailable'] or chuva_mv == '' %}
          unavailable
        {% else %}
          {% set chuva_mv_float = chuva_mv | float(0) %}
          {% if chuva_mv_float <= 500 %}
            Fraca
          {% elif chuva_mv_float <= 2000 %}
            Moderada
          {% else %}
            Forte
          {% endif %}
        {% endif %}
      icon: mdi:weather-pouring
#
- sensor:
    # 📌 Consumo de Água do Umidificador
    - name: "Consumo de Água do Umidificador"
      unit_of_measurement: "L/min"
      state: >
        {% set potencia = states('sensor.tomada_mesa_potencia') | float(0) %}
        {% if potencia > 20 %}
          {{ (4 / 3) / 360 | round(5) }}
        {% elif 18 <= potencia < 21 %}
          {{ (4 / 4) / 360 | round(5) }}
        {% elif 15 <= potencia < 18 %}
          {{ (4 / 5) / 360 | round(5) }}
        {% elif 10 <= potencia < 15 %}
          {{ (4 / 6) / 360 | round(5) }}
        {% elif 5 <= potencia < 10 %}
          {{ (4 / 8) / 360 | round(5) }}
        {% else %}
          0
        {% endif %}

    # 📌 Tempo de Operação do Umidificador
    - name: "Tempo de Operação do Umidificador"
      unit_of_measurement: "min"
      state: >
        {% set switch_entity = 'switch.tomada_mesa_tomada_1' %}
        {% if states(switch_entity) not in ['unknown', 'unavailable'] and is_state(switch_entity, 'on') %}
          {% set total_segundos = as_timestamp(states[switch_entity].last_changed) %}
          {{ ((as_timestamp(now()) - total_segundos) / 60) | round(1) }}
        {% else %}
          0
        {% endif %}

    # 📌 Nível de Água do Umidificador (Corrigido para evitar valores negativos)
    - name: "Nível de Água do Umidificador"
      unit_of_measurement: "L"
      state: >
        {% set consumo_por_minuto = states('sensor.consumo_de_agua_do_umidificador') | float(0) %}
        {% set nivel_atual = states('input_number.nivel_atual_umidificador') | float(4) %}
        {% set tempo_operando = states('sensor.tempo_de_operacao_do_umidificador') | float(0) %}

        {% if is_state('switch.tomada_mesa_tomada_1', 'on') %}
          {% set novo_nivel = nivel_atual - (consumo_por_minuto * tempo_operando) %}
          {{ [novo_nivel, 0] | max | round(2) }}  # Garante que o nível nunca seja negativo
        {% else %}
          {{ nivel_atual }}  # Mantém o último valor quando o umidificador desliga
        {% endif %}
#
# Fim do primeiro arquivo

