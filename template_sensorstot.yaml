# =========================================================
# CONSUMO SIMULADO
# =========================================================
- sensor:
    - name: "chuveiro_consumo_diario"
      unique_id: chuveiro_consumo_diario
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing
      icon: mdi:shower-head
      state: >
        {% set potencia = states('input_number.potencia_chuveiro') | float(0) %}
        {% set horas = states('input_number.horas_uso_chuveiro') | float(0) %}
        {{ (potencia * horas / 1000) | round(2) }}

    - name: "filtro_de_agua_consumo_diario"
      unique_id: filtro_de_agua_consumo_diario
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing
      icon: mdi:water-pump
      state: >
        {% set potencia = 100 %}
        {% set horas = 24 %}
        {% set fator_ciclo = 0.0758 %}
        {{ (potencia * horas * fator_ciclo / 1000) | round(2) }}

    - name: "iluminacao_comum_consumo"
      unique_id: iluminacao_comum_consumo
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing
      icon: mdi:lightbulb-group
      state: >
        {% set potencia_total = 300 %}
        {% set horas = states('input_number.horas_iluminacao') | float(0) %}
        {{ (potencia_total * horas / 1000) | round(2) }}

    - name: "consumo_total_simulado"
      unique_id: consumo_total_simulado
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing
      icon: mdi:counter
      state: >
        {% set sensores = [
          'sensor.chuveiro_consumo_diario',
          'sensor.cervejeira_consumo_diario',
          'sensor.filtro_de_agua_consumo_diario',
          'sensor.iluminacao_comum_consumo'
        ] %}
        {% set total = namespace(value=0) %}
        {% for entidade in sensores %}
          {% set total.value = total.value + (states(entidade) | float(0)) %}
        {% endfor %}
        {{ total.value | round(2) }}

    - name: "custo_energetico_diario"
      unique_id: custo_energetico_diario
      unit_of_measurement: "BRL"
      icon: mdi:cash
      state: >
        {% set consumo = states('sensor.consumo_total_simulado') | float(0) %}
        {% set tarifa = states('input_number.valor_kwh') | float(0.5) %}
        {{ (consumo * tarifa) | round(2) }}

# =========================================================
# MÁQUINA / CONTEXTO DA CASA
# =========================================================
- sensor:
    - name: "Máquina Lavar - Ciclo"
      unique_id: maquina_lavar_ciclo
      state: >
        {{ states('input_select.maquina_lavar_estado') }}
      icon: >
        {% set s = states('input_select.maquina_lavar_estado') %}
        {% if s == 'Desligada' %}
          mdi:washing-machine-off
        {% elif s == 'Enchendo' %}
          mdi:water-sync
        {% elif s == 'Molho' %}
          mdi:timer-sand
        {% elif s in ['Lavando', 'Enxaguando'] %}
          mdi:washing-machine
        {% elif s == 'Esvaziando' %}
          mdi:pump
        {% elif s == 'Centrifugando' %}
          mdi:fan
        {% elif s == 'Finalizada' %}
          mdi:check-circle
        {% else %}
          mdi:washing-machine-alert
        {% endif %}

    - name: "Dispositivos Indisponíveis"
      unique_id: dispositivos_indisponiveis
      unit_of_measurement: "dispositivos"
      state_class: measurement
      icon: mdi:alert-circle-outline
      state: >
        {{ states | selectattr('state', 'eq', 'unavailable') | list | count }}

    - name: "Casa Atividade Eletrodomésticos"
      unique_id: casa_atividade_eletrodomesticos
      icon: mdi:home-lightning-bolt
      state: >
        {% set atividades = [] %}

        {% set maquina_ciclo = states('sensor.maquina_lavar_ciclo') %}
        {% set maquina_status = states('sensor.maquina_lavar_status') %}
        {% set maquina_power = states('sensor.maquina_lavar_potencia') | float(0) %}
        {% set estados_inativos = [
          'unknown', 'unavailable', 'none', '',
          'idle', 'Idle',
          'desligada', 'Desligada',
          'inativo', 'Inativo',
          'finalizado', 'Finalizado',
          'finalizada', 'Finalizada',
          'parada', 'Parada',
          'off', 'Off'
        ] %}

        {% if maquina_ciclo not in estados_inativos %}
          {% set atividades = atividades + ['🧺 Máquina: ' ~ maquina_ciclo] %}
        {% elif maquina_status not in estados_inativos %}
          {% set atividades = atividades + ['🧺 Máquina: ' ~ maquina_status] %}
        {% elif maquina_power > 5 %}
          {% set atividades = atividades + ['🧺 Máquina em uso'] %}
        {% endif %}

        {% set tv_estado = states('media_player.lg_webos_tv_oled55g3psa') %}
        {% set tv_source = state_attr('media_player.lg_webos_tv_oled55g3psa', 'source') %}
        {% set tv_title = state_attr('media_player.lg_webos_tv_oled55g3psa', 'media_title') %}

        {% if tv_estado in ['on', 'playing', 'paused', 'idle'] %}
          {% if tv_source not in [none, '', 'unknown', 'unavailable'] %}
            {% set atividades = atividades + ['📺 TV: ' ~ tv_source] %}
          {% elif tv_title not in [none, '', 'unknown', 'unavailable'] %}
            {% set atividades = atividades + ['📺 TV: ' ~ tv_title] %}
          {% else %}
            {% set atividades = atividades + ['📺 TV ligada'] %}
          {% endif %}
        {% endif %}

        {% set micro_power = states('sensor.micro_ondas_potencia') | float(0) %}
        {% set micro_corrente = states('sensor.micro_ondas_corrente') | float(0) %}
        {% if micro_power > 100 or micro_corrente > 1 %}
          {% set atividades = atividades + ['🍲 Microondas em uso'] %}
        {% endif %}

        {{ atividades | join(' • ') if atividades | length > 0 else 'Inativo' }}
