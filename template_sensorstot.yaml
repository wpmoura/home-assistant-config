# template_sensorstot_v2_moderno.yaml
# Arquivo modernizado para uso em configuration.yaml com:
# template: !include template_sensorstot.yaml
#
# Ajustes aplicados:
# - Removido friendly_name inválido em template moderno.
# - Corrigido sensor solto custo_energetico_diario.
# - Corrigidos sensores numéricos que retornavam texto.
# - Corrigidos filtros float sem default.
# - Removidos comentários dentro do retorno de state.
# - Removido binary_sensor Todos Dormindo para evitar duplicidade de unique_id com modo_dormir.

# =========================================================
# PESOS / BALANÇA
# =========================================================
- sensor:
    - name: "Peso Moura"
      unique_id: peso_moura
      unit_of_measurement: "kg"
      device_class: weight
      state_class: measurement
      availability: >
        {% set peso = states('sensor.mi_smart_scale_eda1_mass') | float(0) %}
        {{ 87 <= peso <= 100 }}
      state: >
        {{ states('sensor.mi_smart_scale_eda1_mass') | float(0) | round(1) }}

    - name: "Peso Camila"
      unique_id: peso_camila
      unit_of_measurement: "kg"
      device_class: weight
      state_class: measurement
      availability: >
        {% set peso = states('sensor.mi_smart_scale_eda1_mass') | float(0) %}
        {{ 71 <= peso <= 86 }}
      state: >
        {{ states('sensor.mi_smart_scale_eda1_mass') | float(0) | round(1) }}

    - name: "Peso Fernanda"
      unique_id: peso_fernanda
      unit_of_measurement: "kg"
      device_class: weight
      state_class: measurement
      availability: >
        {% set peso = states('sensor.mi_smart_scale_eda1_mass') | float(0) %}
        {{ 59 <= peso <= 70 }}
      state: >
        {{ states('sensor.mi_smart_scale_eda1_mass') | float(0) | round(1) }}

    - name: "Peso Jacira"
      unique_id: peso_jacira
      unit_of_measurement: "kg"
      device_class: weight
      state_class: measurement
      availability: >
        {% set peso = states('sensor.mi_smart_scale_eda1_mass') | float(0) %}
        {{ 50 <= peso <= 57 }}
      state: >
        {{ states('sensor.mi_smart_scale_eda1_mass') | float(0) | round(1) }}

# =========================================================
# ESTADOS OPERACIONAIS / TEXTO
# =========================================================
- sensor:
    - name: "Energia Concessionaria"
      unique_id: energia_concessionaria
      icon: mdi:transmission-tower
      state: >-
        {% if states('sensor.ups_voltagem') in ['unknown', 'unavailable', 'none', ''] %}
          off
        {% else %}
          on
        {% endif %}

    - name: "qBittorrent Sem Transferências"
      unique_id: qbittorrent_sem_transferencias
      icon: mdi:download
      state: >
        {% set download = states('sensor.qbittorrent_download_speed') | float(0) %}
        {% set upload = states('sensor.qbittorrent_upload_speed') | float(0) %}
        {% if download == 0 and upload == 0 %}
          idle
        {% else %}
          active
        {% endif %}

    - name: "Intensidade da Chuva"
      unique_id: intensidade_da_chuva
      icon: mdi:weather-pouring
      state: >
        {% set chuva_mv = states('sensor.sensor_chuva_girasol_rain_intensity') %}
        {% if chuva_mv | lower in ['unknown', 'unavailable', 'none', ''] %}
          Indisponível
        {% else %}
          {% set chuva_mv_float = chuva_mv | float(0) %}
          {% if chuva_mv_float <= 500 %}
            Fraca
          {% elif chuva_mv_float <= 2000 %}
            Moderada
          {% else %}
            Forte
          {% endif %}
        {% endif %}

# =========================================================
# UMIDIFICADOR
# =========================================================
- sensor:
    - name: "Consumo de Água do Umidificador"
      unique_id: consumo_de_agua_do_umidificador
      unit_of_measurement: "L/min"
      state_class: measurement
      icon: mdi:water-percent
      state: >
        {% set potencia = states('sensor.tomada_mesa_potencia') | float(0) %}
        {% if potencia > 20 %}
          {{ ((4 / 3) / 360) | round(5) }}
        {% elif 18 <= potencia < 21 %}
          {{ ((4 / 4) / 360) | round(5) }}
        {% elif 15 <= potencia < 18 %}
          {{ ((4 / 5) / 360) | round(5) }}
        {% elif 10 <= potencia < 15 %}
          {{ ((4 / 6) / 360) | round(5) }}
        {% elif 5 <= potencia < 10 %}
          {{ ((4 / 8) / 360) | round(5) }}
        {% else %}
          0
        {% endif %}

    - name: "Tempo de Operação do Umidificador"
      unique_id: tempo_de_operacao_do_umidificador
      unit_of_measurement: "min"
      state_class: measurement
      icon: mdi:timer-outline
      state: >
        {% set switch_entity = 'switch.tomada_mesa_tomada_1' %}
        {% if states(switch_entity) not in ['unknown', 'unavailable', 'none', ''] and is_state(switch_entity, 'on') %}
          {% set total_segundos = as_timestamp(states[switch_entity].last_changed) %}
          {{ ((as_timestamp(now()) - total_segundos) / 60) | round(1) }}
        {% else %}
          0
        {% endif %}

    - name: "Nível de Água do Umidificador"
      unique_id: nivel_de_agua_do_umidificador
      unit_of_measurement: "L"
      state_class: measurement
      icon: mdi:cup-water
      state: >
        {% set consumo_por_minuto = states('sensor.consumo_de_agua_do_umidificador') | float(0) %}
        {% set nivel_atual = states('input_number.nivel_atual_umidificador') | float(4) %}
        {% set tempo_operando = states('sensor.tempo_de_operacao_do_umidificador') | float(0) %}
        {% if is_state('switch.tomada_mesa_tomada_1', 'on') %}
          {% set novo_nivel = nivel_atual - (consumo_por_minuto * tempo_operando) %}
          {{ [novo_nivel, 0] | max | round(2) }}
        {% else %}
          {{ nivel_atual | round(2) }}
        {% endif %}

# =========================================================
# CONSUMO ESTIMADO - LÂMPADAS / CARGAS
# =========================================================
- sensor:
    - name: "top1_consumo_energia"
      unique_id: top1_consumo_energia
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing
      icon: mdi:lightbulb-on
      state: >
        {% set ligado = is_state('light.top1', 'on') %}
        {% set minutos = ((as_timestamp(now()) - as_timestamp(states.light.top1.last_changed)) / 60) if ligado else 0 %}
        {% set anterior = states('sensor.top1_consumo_energia') | float(0) %}
