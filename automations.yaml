- id: beda4eccd9534a01b347bfcda565cc75
  alias: Home office - Notificar mudança de conexão ativa
  description: Envia uma notificação quando a conexão ativa muda entre Fibra e 4G.
  triggers:
  - entity_id:
    - sensor.fibra_status
    - sensor.rede_4g_status
    trigger: state
  conditions:
  - condition: template
    value_template: "{% if trigger.entity_id == 'sensor.mikrotik_ether1_tx' %}\n  {{
      trigger.to_state.state != trigger.from_state.state }}\n{% elif trigger.entity_id
      == 'sensor.mikrotik_ether2_tx' %}\n  {{ trigger.to_state.state != trigger.from_state.state
      }}\n{% else %}\n  false\n{% endif %}"
  actions:
  - data:
      message: "{% if is_state('sensor.mikrotik_ether1_tx', 'ativo') %}\n  A conexão
        ativa agora é a Fibra (ether1).\n{% elif is_state('sensor.mikrotik_ether2_tx',
        'ativo') %}\n  A conexão ativa agora é o 4G (ether2).\n{% else %}\n  Não há
        conexão ativa no momento.\n{% endif %}        "
    action: notify.mobile_app_iphone14
