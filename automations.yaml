- id: 2354b9af0ff94a2dbfbd472c6991ec4f
  alias: Home Office - Monitorar falta de energia e desligar após 30 minutos
  description: Envia alertas periódicos durante falta de energia, informa quando a
    energia é restabelecida e desliga o sistema após 30 minutos.
  triggers:
  - entity_id: sensor.Energia_Concessionaria
    to: 'off'
    trigger: state
  - entity_id: sensor.Energia_Concessionaria
    to: 'on'
    trigger: state
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: sensor.Energia_Concessionaria
        state: 'on'
      sequence:
      - target:
          entity_id: input_boolean.energia_falta
        action: input_boolean.turn_off
        data: {}
      - data:
          message: A energia foi restabelecida. O sistema voltou ao funcionamento
            normal.
        action: notify.mobile_app_iphone14
    - conditions:
      - condition: state
        entity_id: sensor.Energia_Concessionaria
        state: 'off'
      sequence:
      - target:
          entity_id: input_boolean.energia_falta
        action: input_boolean.turn_on
        data: {}
      - data:
          message: Falta de energia detectada. O monitoramento começou.
        action: notify.mobile_app_iphone14
      - delay: 00:05:00
      - repeat:
          count: 5
          sequence:
          - data:
              message: "{% if repeat.index == 5 %}\n  A energia não foi restabelecida
                em 30 minutos. O sistema será desligado agora.\n{% else %}\n  Falta
                de energia detectada. Por favor, verifique o sistema. Tempo decorrido:
                {{ repeat.index * 5 }} minutos.\n{% endif %}"
            action: notify.mobile_app_iphone14
          - delay:
              minutes: 5
      - condition: state
        entity_id: sensor.Energia_Concessionaria
        state: 'off'
      - action: hassio.host_shutdown
        data: {}
        enabled: false
  mode: restart
- id: f28140c6fe9b45448dd8b393d075640d
  alias: Quarto - Monitorar estado do umidificador
  description: Verifica se o umidificador está sem água com base na potência e no
    estado da tomada, incluindo um delay para estabilização.
  triggers:
  - entity_id: switch.tomada_mesa_tomada_1
    to: 'on'
    trigger: state
  - entity_id: sensor.tomada_mesa_potencia
    below: 15
