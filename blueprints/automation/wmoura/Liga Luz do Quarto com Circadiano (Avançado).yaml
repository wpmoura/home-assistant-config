blueprint:
  name: Liga Luz do Quarto Simples (Sem Circadiano)
  description: >
    Liga uma luz do quarto quando detectar movimento, entre horários e dias especificados. 
    Mantém brilho e cor padrão configurados na lâmpada.
  domain: automation
  input:
    movimento:
      name: Sensor de movimento
      selector:
        entity:
          domain: binary_sensor
    luz:
      name: Luz a ser ligada
      selector:
        entity:
          domain: light
    hora_inicio:
      name: Hora de início
      default: "08:30:00"
      selector:
        time: {}
    hora_fim:
      name: Hora de término
      default: "19:00:00"
      selector:
        time: {}
    dias:
      name: Dias da semana
      default:
        - mon
        - tue
        - wed
        - thu
        - fri
      selector:
        select:
          multiple: true
          options:
            - mon
            - tue
            - wed
            - thu
            - fri
            - sat
            - sun

trigger:
  - platform: state
    entity_id: !input movimento
    to: "on"

condition:
  - condition: time
    after: !input hora_inicio
    before: !input hora_fim
    weekday: !input dias

action:
  - service: light.turn_on
    target:
      entity_id: !input luz

mode: single
