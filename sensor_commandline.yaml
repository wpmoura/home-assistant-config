#arquivo command_line.yaml
  # ==============================================
  # 📌 COMMAND_LINE
  # ==============================================
  - platform: command_line
    name: CPU Temperature
    command: "cat /sys/class/thermal/thermal_zone0/temp"
    unit_of_measurement: "°C"
    value_template: "{{ value | multiply(0.001) | round(1) }}"
    
  - platform: command_line
    name: "Temperatura RPi5"
    command: "ssh -i /config/ssh/id_rsa -o StrictHostKeyChecking=no wmoura@192.168.60.18 'cat /sys/class/thermal/thermal_zone0/temp'"
    value_template: "{{ (value | int / 1000) | round(1) }}"
    unit_of_measurement: "°C"
  #
  # ==============================================
  # 📌 OPENHARDWAREMONITOR
  # ==============================================
  - platform: openhardwaremonitor
    host: 192.168.0.128

  # ==============================================
  # 📌 HISTORY_STATS
  # ==============================================
  - platform: history_stats
    name: Disponibilidade Claro horas - 30 dias
    entity_id: binary_sensor.net_claro
    state: "on"
    type: time
    start: "{{ now() - timedelta(days=30) }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: Disponibilidade Claro count - 30 dias
    entity_id: binary_sensor.net_claro
    state: "on"
    type: count
    start: "{{ now() - timedelta(days=30) }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: Disponibilidade Claro Média - 30 dias
    entity_id: binary_sensor.net_claro
    state: "on"
    type: ratio
    start: "{{ now() - timedelta(days=30) }}"
    end: "{{ now() }}"

  # ==============================================
  # 📌 REST
  # ==============================================
